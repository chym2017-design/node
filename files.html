<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>我的空间 - UDD 文件管理</title>
<link rel="stylesheet" href="/files.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true" width="0" height="0">
    <defs>
      <symbol id="file-i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></symbol>
      <symbol id="file-i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
      <symbol id="file-i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="file-i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M5 15v5h14v-5"/></symbol>
      <symbol id="file-i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6.1 8a7 7 0 0 1 11.8-1L20 12M4 12l2.1 5a7 7 0 0 0 11.8-1"/></symbol>
      <symbol id="file-i-back" viewBox="0 0 24 24"><path d="m10 5-7 7 7 7M3 12h18"/></symbol>
      <symbol id="file-i-tag" viewBox="0 0 24 24"><path d="M20 13 13 20 3 10V4h6Z"/><circle cx="8" cy="8" r="1"/></symbol>
      <symbol id="file-i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
      <symbol id="file-i-udd" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h5M9 12v3a3 3 0 0 0 6 0v-3"/></symbol>
      <symbol id="file-i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m3 17 5-5 4 4 3-3 6 6"/></symbol>
      <symbol id="file-i-media" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3Z"/></symbol>
      <symbol id="file-i-audio" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 9l10-2"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></symbol>
      <symbol id="file-i-sheet" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">UDD</div>
      <div class="brand-copy">
        <span class="brand-title">我的空间</span>
        <span class="brand-sub">文件管理</span>
      </div>
    </div>
    <div class="spacer"></div>
    <span class="account" id="account"></span>
    <a class="top-link" href="/"><svg class="ui-icon"><use href="#file-i-back"/></svg>返回编辑器</a>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-label">空间</div>
      <nav class="side-nav" aria-label="文件空间">
        <button class="side-item active" data-view="all" id="nav-all">
          <svg class="ui-icon"><use href="#file-i-folder"/></svg><span>全部文件</span>
        </button>
        <button class="side-item" data-view="trash" id="nav-trash">
          <svg class="ui-icon"><use href="#file-i-trash"/></svg><span>回收站</span>
          <span class="count" id="trash-count"></span>
        </button>
      </nav>
      <div class="side-heading">
        <span>标签</span>
        <button id="new-tag" title="新建标签" aria-label="新建标签"><svg class="ui-icon"><use href="#file-i-plus"/></svg></button>
      </div>
      <div id="tag-list"></div>
      <div class="sidebar-note">
        <svg class="ui-icon"><use href="#file-i-upload"/></svg>
        <p>将文件拖入列表即可上传<br>双击文件夹或文档直接打开</p>
      </div>
    </aside>

    <main class="content">
      <section class="content-heading">
        <div>
          <div class="space-caption">个人文档空间</div>
          <h1 id="view-title">全部文件</h1>
        </div>
        <div class="create-actions" id="create-actions">
          <button class="btn" id="btn-new-folder"><svg class="ui-icon"><use href="#file-i-plus"/></svg>新建文件夹</button>
          <button class="btn primary" id="btn-upload"><svg class="ui-icon"><use href="#file-i-upload"/></svg>上传文件</button>
        </div>
        <div class="actions" id="actions-trash" hidden>
          <button class="btn danger" id="btn-empty-trash">清空回收站</button>
        </div>
      </section>

      <div class="toolbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="actions" id="actions-all">
          <button class="btn" id="btn-rename" disabled>重命名</button>
          <button class="btn" id="btn-move" disabled>移动</button>
          <button class="btn" id="btn-copy" disabled>复制</button>
          <button class="btn" id="btn-tag" disabled>标签</button>
          <button class="btn" id="btn-download" disabled>下载</button>
          <button class="btn danger" id="btn-delete" disabled>删除</button>
          <span class="toolbar-sep"></span>
          <button class="btn icon-btn" id="btn-refresh" title="刷新当前目录" aria-label="刷新当前目录"><svg class="ui-icon"><use href="#file-i-refresh"/></svg></button>
        </div>
      </div>

      <section class="file-surface" aria-label="文件列表">
        <div class="list-head" id="list-head">
          <label class="check"><input type="checkbox" id="select-all" aria-label="选择全部文件"></label>
          <span></span>
          <span>名称</span>
          <span id="meta-head">标签</span>
          <span>大小</span>
          <span>修改时间</span>
        </div>
        <div class="file-list" id="file-list"></div>
      </section>
      <div class="statusbar">
        <span id="status-count">0 项</span>
        <span id="status-selected"></span>
        <span class="spacer"></span>
        <span id="status-path"></span>
      </div>
    </main>
  </div>

  <input type="file" id="upload-input" multiple hidden>
  <div id="modal-root"></div>
  <div class="drag-hint" id="drag-hint">松开鼠标，移动到文件夹</div>

<script src="/files.js"></script>
</body>
</html>
