<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UDD - 统一数据展示系统</title>
<link rel="stylesheet" href="css/udd-styles.css">
<link rel="stylesheet" href="css/udd-sheet.css">
<link rel="stylesheet" href="css/udd-ppt.css">
</head>
<body>
<div id="app">
  <!-- ===== HEADER: Menu bar, toolbar, format switches, view tabs ===== -->
  <header id="header">
    <div id="menu-bar">
      <span class="logo">UDD</span>
      <input id="doc-title" class="doc-title" value="未命名文档" spellcheck="false">
      <button class="menu-btn primary" onmousedown="event.preventDefault()" onclick="app.newFile()" title="Ctrl+N">新建</button>
      <button class="menu-btn" onmousedown="event.preventDefault()" onclick="app.openFile()" title="Ctrl+O">打开</button>
      <button class="menu-btn" onmousedown="event.preventDefault()" onclick="app.saveFile()" title="Ctrl+S">保存</button>
      <button class="menu-btn" onmousedown="event.preventDefault()" onclick="app.saveFileAs()">另存为</button>
      <div class="menu-sep"></div>
      <button class="menu-btn" onmousedown="event.preventDefault()" onclick="app.exportPDF()" title="导出为 PDF（使用浏览器打印对话框，选择&quot;另存为 PDF&quot;）">PDF</button>
      <button class="menu-btn" onmousedown="event.preventDefault()" onclick="app.exportWord()" title="导出为 Word .doc">Word</button>
      <button class="menu-btn" onmousedown="event.preventDefault()" onclick="app.exportJSON()">导出JSON</button>
      <button class="menu-btn" onmousedown="event.preventDefault()" onclick="app.importJSON()">导入JSON</button>
    </div>
    <div id="toolbar">
      <button class="tool-btn" onclick="app.undo()" title="撤销 Ctrl+Z">↩</button>
      <button class="tool-btn" onclick="app.redo()" title="重做 Ctrl+Shift+Z">↪</button>
      <div class="tool-sep"></div>
      <select id="tool-font" class="tool-select" onchange="app.setNodeStyle('font',this.value)" title="字体">
        <option value="微软雅黑">微软雅黑</option>
        <option value="宋体">宋体</option>
        <option value="黑体">黑体</option>
        <option value="楷体">楷体</option>
        <option value="仿宋">仿宋</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
      </select>
      <select id="tool-size" class="tool-select" onchange="app.setNodeStyle('font_size',+this.value)" title="字号" style="width:60px">
        <option value="12">12</option><option value="14">14</option><option value="16">16</option>
        <option value="18">18</option><option value="20">20</option><option value="24">24</option>
        <option value="28">28</option><option value="32">32</option><option value="36">36</option>
      </select>
      <div class="tool-sep"></div>
      <button id="tool-bold" class="tool-btn" onclick="app.toggleStyle('bold')" title="加粗 Ctrl+B"><b>B</b></button>
      <button id="tool-italic" class="tool-btn" onclick="app.toggleStyle('italic')" title="斜体 Ctrl+I"><i>I</i></button>
      <button id="tool-underline" class="tool-btn" onclick="app.toggleStyle('underline')" title="下划线 Ctrl+U"><u>U</u></button>
      <button id="tool-strike" class="tool-btn" onclick="app.toggleStyle('strikethrough')" title="删除线"><s>S</s></button>
      <div class="tool-sep"></div>
      <div class="tool-color-wrap" id="color-wrap-fg">
        <button type="button" class="tool-color-btn" id="tool-color-btn" onclick="app.applyLastColor('fg')" title="字体颜色">
          <span class="tool-color-preview" id="tool-color-preview" style="background:#1e293b"></span>
        </button>
        <button type="button" class="tool-color-arrow" onclick="app.toggleColorPalette('fg')">▾</button>
        <div class="color-palette" id="palette-fg"></div>
      </div>
      <div class="tool-color-wrap" id="color-wrap-bg">
        <button type="button" class="tool-color-btn" id="tool-bg-btn" onclick="app.applyLastColor('bg')" title="背景色">
          <span class="tool-color-preview" id="tool-bg-preview" style="background:#ffffff;border:1px solid var(--gray-200)"></span>
        </button>
        <button type="button" class="tool-color-arrow" onclick="app.toggleColorPalette('bg')">▾</button>
        <div class="color-palette" id="palette-bg"></div>
      </div>
      <div class="tool-color-wrap" id="color-wrap-ref">
        <button type="button" class="tool-color-btn" id="tool-ref-btn" onclick="app.applyLastColor('ref')" title="引用背景色（▾ 含"无设置"恢复默认浅蓝）">
          <span class="tool-color-preview" id="tool-ref-preview" style="background:#eff6ff;border:1px solid var(--blue-200)"></span>
        </button>
        <button type="button" class="tool-color-arrow" onclick="app.toggleColorPalette('ref')">▾</button>
        <div class="color-palette" id="palette-ref"></div>
      </div>
      <div class="tool-sep"></div>
      <select id="tool-page-size" class="tool-select" onchange="app.setPageSize(this.value)" title="文档视图页面尺寸（分页）" style="width:90px">
        <option value="">不分页</option>
        <option value="A4">A4</option>
        <option value="A3">A3</option>
        <option value="A5">A5</option>
        <option value="letter">Letter</option>
        <option value="legal">Legal</option>
        <option value="B5">B5</option>
      </select>
      <div class="tool-sep"></div>
      <button id="tool-align-left" class="tool-btn" onclick="app.setNodeStyle('text_align','left')" title="左对齐">≡</button>
      <button id="tool-align-center" class="tool-btn" onclick="app.setNodeStyle('text_align','center')" title="居中">≡</button>
      <button id="tool-align-right" class="tool-btn" onclick="app.setNodeStyle('text_align','right')" title="右对齐">≡</button>
      <div class="tool-sep"></div>
      <select id="tool-numbering" class="tool-select" onchange="app.setNumbering(this.value)" title="编号样式" style="width:90px">
        <option value="1.1.1">1.1.1</option>
        <option value="一.1.1">一.1.1</option>
        <option value="I.A.1">I.A.1</option>
        <option value="bullet">无序</option>
        <option value="bullet-uniform">统一无序</option>
        <option value="none">无编号</option>
      </select>
      <button id="tool-no-number" class="tool-btn" onclick="app.toggleNoNumber()" title="此节点不显示编号（且不占编号位）">⊘</button>
      <button id="tool-restart-number" class="tool-btn" onclick="app.toggleRestartNumber()" title="从此节点起在同级重新编号">↺1</button>
      <div class="tool-sep"></div>
      <button class="tool-btn" onclick="app.insertMedia()" title="插入媒体">🖼</button>
      <button class="tool-btn" onclick="app.insertTableRef()" title="插入表格引用">☐</button>
    </div>
    <div class="fmt-sw" id="fmt-switches">
      <label><input type="checkbox" data-fmt="font" checked>字体</label>
      <label><input type="checkbox" data-fmt="font_size" checked>字号</label>
      <label><input type="checkbox" data-fmt="color" checked>颜色</label>
      <label><input type="checkbox" data-fmt="bold" checked>加粗</label>
      <label><input type="checkbox" data-fmt="italic">斜体</label>
      <label><input type="checkbox" data-fmt="underline">下划线</label>
      <label><input type="checkbox" data-fmt="strikethrough">删除线</label>
      <label><input type="checkbox" data-fmt="background_color">背景色</label>
      <label><input type="checkbox" data-fmt="text_align">对齐</label>
      <label><input type="checkbox" data-fmt="tree_lines">树线</label>
      <label><input type="checkbox" data-fmt="body_border">正文线</label>

    </div>
    <div id="view-tabs">
      <button id="repo-toggle" onclick="app.toggleRepo()" style="background:none;border:1px solid var(--gray-200);padding:3px 10px;font-size:12px;color:var(--gray-500);cursor:pointer;border-radius:var(--radius)">仓库</button>
      <button class="view-tab active" data-view="outline" onclick="app.switchView('outline')">大纲</button>
      <button class="view-tab" data-view="mindmap" onclick="app.switchView('mindmap')">思维导图</button>
      <button class="view-tab" data-view="document" onclick="app.switchView('document')">文档</button>
      <button class="view-tab" data-view="sheet" onclick="app.switchView('sheet')">表格</button>
      <button class="view-tab" data-view="ppt" onclick="app.switchView('ppt')">演示</button>
      <button class="view-tab" data-view="graph" onclick="app.switchView('graph')">图谱</button>
      <button id="back-btn" onclick="app.goBack()" style="display:none;background:none;border:1px solid var(--gray-200);padding:3px 10px;font-size:12px;color:var(--primary);cursor:pointer;border-radius:var(--radius);margin-left:4px">← 返回</button>
      <div class="spacer"></div>
      <button id="render-toggle" onclick="app.toggleRenderMode()" style="background:none;border:1px solid var(--gray-200);padding:3px 10px;font-size:12px;color:var(--gray-500);cursor:pointer;border-radius:var(--radius)">渲染 on</button>
      <button id="refresh-view" onclick="app.refreshCurrentView()" title="刷新当前视图（强制重新渲染，引用/媒体重新读取）" style="background:none;border:1px solid var(--gray-200);padding:3px 8px;font-size:12px;color:var(--gray-500);cursor:pointer;border-radius:var(--radius);margin-left:4px">🔄 刷新</button>
      <button id="source-toggle" onclick="app.toggleContentSource()" style="display:none;background:var(--blue-50);border:1px solid var(--blue-200);padding:3px 10px;font-size:12px;color:var(--primary);cursor:pointer;border-radius:var(--radius);margin-left:4px">来源:嵌入</button>
      <input id="tool-fold-n" type="number" value="5" min="1" max="20" title="展开层数">
      <button id="fold-level-btn" onclick="app.expandToLevel()">展开n层</button>
      <button id="fold-all-btn" onclick="app.expandAll()">全部展开</button>
      <button id="sidebar-toggle" onclick="app.toggleSidebar()">侧边栏</button>
    </div>
  </header>

  <!-- ===== MAIN: Repository panel, editor views, sidebar ===== -->
  <main id="main">
    <!-- Repository panel (left) -->
    <div id="repo-panel">
      <div class="repo-header">
        <span>仓库</span>
        <span style="display:flex;gap:4px;align-items:center">
          <button onclick="app.toggleRepo()" title="关闭">×</button>
        </span>
      </div>
      <div id="open-docs-panel">
        <div class="open-docs-title">已打开的文档</div>
      </div>
      <div style="display:flex;align-items:center;border-bottom:1px solid var(--gray-100)">
        <div id="repo-path" onclick="app.repoPromptDir()" title="点击修改目录" style="flex:1"></div>
        <button onclick="app.repoGoUp()" title="上级目录" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:16px;padding:2px 6px">↑</button>
        <button onclick="app.repoRefresh()" title="刷新" style="background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:16px;padding:2px 6px">⟲</button>
      </div>
      <div id="repo-list"></div>
      <div id="repo-status"></div>
    </div>

    <!-- Editor views -->
    <div id="editor">
      <div id="outline-view" class="active"></div>
      <div id="mindmap-view"></div>
      <div id="document-view"></div>
      <div id="sheet-view"></div>
      <div id="ppt-view"></div>
      <div id="graph-view"></div>
    </div>

    <!-- Sidebar (right) -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span id="sidebar-tab-raw" onclick="app.setSidebarMode('raw')" style="cursor:pointer;border-bottom:2px solid var(--primary);padding-bottom:2px">原始数据</span>
        <span id="sidebar-tab-values" onclick="app.setSidebarMode('values')" style="cursor:pointer;color:var(--gray-400);padding-bottom:2px;margin-left:10px">仅查看值</span>
        <span style="flex:1"></span>
        <span style="display:flex;gap:4px;align-items:center">
          <button onclick="app.showAllSidebarData()" title="查看全部数据" style="font-size:12px;padding:2px 8px">查看全部</button>
          <button onclick="app.applySidebarJSON()" title="应用修改">✓</button>
        </span>
      </div>
      <div id="sidebar-content">
        <textarea id="sidebar-json" spellcheck="false"></textarea>
      </div>
    </div>
  </main>

  <!-- ===== STATUS BAR ===== -->
  <footer id="status-bar">
    <span id="stat-nodes">节点: 0</span>
    <span class="sep"></span>
    <span id="stat-words">字数: 0</span>
    <span class="sep"></span>
    <span id="stat-level">层级: -</span>
    <span class="sep"></span>
    <span id="stat-save">未保存</span>
  </footer>
</div>

<div id="toast"></div>

<!-- ===== SCRIPTS (load order matters) ===== -->
<script src="js/jszip.min.js"></script>
<script src="js/udd-data.js"></script>
<script src="js/udd-ref.js"></script>
<script src="js/udd-media.js"></script>
<script src="js/udd-file.js"></script>
<script src="js/udd-outline.js"></script>
<script src="js/udd-document.js"></script>
<script src="js/udd-mindmap.js"></script>
<script src="js/xlsx.min.js"></script>
<script src="js/udd-sheet.js"></script>
<script src="js/pptxgen.min.js"></script>
<script src="js/udd-ppt.js"></script>
<script src="js/udd-graph.js"></script>
<script src="js/udd-app.js"></script>
</body>
</html>
