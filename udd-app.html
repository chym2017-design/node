}

// ================================================================
//  OUTLINE VIEW
// ================================================================
class OutlineView {
  constructor(container) {
    this.el = container;
    this.focusPath = null;
    this.focusField = 'content';
    this.focusCursorEnd = true;
    this.el.addEventListener('keydown', e => this.onKeyDown(e));
    this.el.addEventListener('input', e => this.onInput(e));
    this.el.addEventListener('focusin', e => this.onFocusIn(e));
  }

  render(data) {
    this.data = data;
    this.el.innerHTML = '';
    const rootKeys = getAllTKeys(data);
    for (const key of rootKeys) {
      this.renderNode(data[key], key, getLevel(key), this.el);
    }
    if (this.focusPath) {
      requestAnimationFrame(() => this.restoreFocus());
    }
    this.updateStatus();
  }

  renderNode(node, path, level, container) {
    if (!node || typeof node !== 'object') return;
    const div = document.createElement('div');
    div.className = 'outline-node';
    div.dataset.path = path;

    const row = document.createElement('div');
    row.className = 'outline-row';

    // indent (t0 gets 0 indent)
    const indent = document.createElement('span');
    indent.className = 'indent';
    indent.style.width = (Math.max(0, level - 1) * 24) + 'px';
    row.appendChild(indent);

    // fold arrow
    const childLevel = level + 1;
    const childKeys = getChildTKeys(node, childLevel);
    const arrow = createFoldToggle(node, path, level, this, 'outline-arrow');
    row.appendChild(arrow);

    // contentWrap: numbering + content + body-btn in one baseline-aligned container
    const contentWrap = document.createElement('div');
    contentWrap.className = 'outline-content-wrap';

    // content
    const style = this.getStyle(path, level);

    // numbering (skip for t0)
    if (level !== 0) {
      const tg = this.data.type_global || {};
      const numStyle = tg.numbering_style || '1.1.1';
      if (numStyle !== 'none') {
        const numSpan = document.createElement('span');
        numSpan.className = 'outline-num';
        numSpan.textContent = this.getNumber(path, numStyle);
        this.applyStyle(numSpan, style);
        contentWrap.appendChild(numSpan);
      }
    }
    const content = document.createElement('div');
    content.className = 'outline-content';
    content.contentEditable = 'plaintext-only';
    if (!content.contentEditable || content.contentEditable === 'inherit') content.contentEditable = 'true';
    const contentText = stripMediaTags(node.content || '');
    renderStyledText(content, contentText, node, 'content', style, (el, runStyle) => this.applyStyle(el, runStyle));
    content.dataset.path = path;
    content.dataset.field = 'content';
    content.dataset.placeholder = level <= 1 ? '输入标题...' : '输入内容...';
    content.spellcheck = false;
    this.applyStyle(content, style);
    const fmt = app && app.outlineFmt ? app.outlineFmt : {};
    if (fmt.text_align && style.text_align) contentWrap.style.justifyContent = style.text_align === 'center' ? 'center' : style.text_align === 'right' ? 'flex-end' : 'flex-start';
    contentWrap.appendChild(content);

    // body button (shared function, inline after content)
    const bodyBtn = createBodyBtn(node, path, this);
    contentWrap.appendChild(bodyBtn);

    row.appendChild(contentWrap);
    div.appendChild(row);

    // Media preview from content
    if (hasMediaTag(node.content || '')) {
      const mediaDiv = document.createElement('div');
      mediaDiv.className = 'outline-media';
      mediaDiv.style.marginLeft = (Math.max(0, level - 1) * 24 + 22) + 'px';
      renderTextWithMedia(node.content, mediaDiv, {path, field:'content'}, {suppressAlign: !fmt.text_align});
      div.appendChild(mediaDiv);
    }

    // body content
    const hasBody = node.body !== undefined && node.body !== '';
    if (!node.hide_body && (hasBody || this.isBodyEditing(path))) {
      const bodyEl = document.createElement('div');
      bodyEl.className = 'outline-body';
      bodyEl.contentEditable = 'plaintext-only';
      if (!bodyEl.contentEditable || bodyEl.contentEditable === 'inherit') bodyEl.contentEditable = 'true';
      const bodyStyle = this.getBodyStyle(path);
      const bodyText = stripMediaTags(node.body || '');
      renderStyledText(bodyEl, bodyText, node, 'body', bodyStyle, (el, runStyle) => this.applyStyle(el, runStyle));
      bodyEl.dataset.path = path;
      bodyEl.dataset.field = 'body';
      bodyEl.spellcheck = false;
      bodyEl.style.marginLeft = (Math.max(0, level - 1) * 24 + 22) + 'px';
      this.applyStyle(bodyEl, bodyStyle);
      div.appendChild(bodyEl);

      // Media preview from body
      if (hasMediaTag(node.body || '')) {
        const bodyMediaDiv = document.createElement('div');
        bodyMediaDiv.className = 'outline-media';
        bodyMediaDiv.style.marginLeft = (Math.max(0, level - 1) * 24 + 22) + 'px';
        renderTextWithMedia(node.body, bodyMediaDiv, {path, field:'body'}, {suppressAlign: !fmt.text_align});
        div.appendChild(bodyMediaDiv);
      }
    }

    // children
    if (!node.hide && childKeys.length > 0) {
      const childContainer = document.createElement('div');
      childContainer.className = 'outline-children';
      for (const ck of childKeys) {
        this.renderNode(node[ck], path + '.' + ck, childLevel, childContainer);
      }
      div.appendChild(childContainer);
    }

    container.appendChild(div);
  }

  isBodyEditing(path) { return this.focusPath === path && this.focusField === 'body'; }

  getNumber(path, numStyle) {
    const parts = path.split('.');
    const nums = [];
    let obj = this.data;
    for (const part of parts) {
      const level = getLevel(part);
      if (level === 0) { obj = obj[part]; continue; }
      const siblings = getChildTKeys(obj, level);
      const idx = siblings.indexOf(part);
      nums.push(idx + 1);
      obj = obj[part];
    }
    if (nums.length === 0) return '';
    if (numStyle === '1.1.1') return nums.join('.');
    if (numStyle === '一.1.1') {
      const cn = ['零','一','二','三','四','五','六','七','八','九','十',
                   '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
      const first = cn[nums[0]] || nums[0];
      return nums.length === 1 ? first : first + '.' + nums.slice(1).join('.');
    }
    if (numStyle === 'I.A.1') {
      const roman = ['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
      const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let result = '';
      if (nums[0]) result = roman[nums[0]] || nums[0];
      if (nums[1]) result += '.' + (alpha[nums[1]-1] || nums[1]);
      if (nums[2]) result += '.' + nums[2];
      for (let i = 3; i < nums.length; i++) result += '.' + nums[i];
      return result;
    }
    if (numStyle === 'bullet') {
      const bullets = ['●','○','■','▪'];
      const depth = nums.length - 1;
      return bullets[Math.min(depth, bullets.length - 1)];
    }
    if (numStyle === 'bullet-uniform') return '●';
    return nums.join('.');
  }

  getStyle(path, level) {
    return buildNodeStyle(this.data, path, level, { isBody: false });
  }

  getBodyStyle(path) {
    return buildNodeStyle(this.data, path, undefined, { isBody: true });
  }

  applyStyle(el, style) {
    applyFmtStyle(el, style, app && app.outlineFmt ? app.outlineFmt : {});
  }

  // Sync all editable elements to data
  syncAll() {
    this.el.querySelectorAll('[data-path][data-field]').forEach(el => {
      const node = getNodeByPath(this.data, el.dataset.path);
      if (!node) return;
      const field = el.dataset.field;
      const media = extractMediaTags(node[field]);
      node[field] = el.textContent + media;
    });
  }

  onInput(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.path || !el.dataset.field) return;
    const node = getNodeByPath(this.data, el.dataset.path);
    if (node) {
      const media = extractMediaTags(node[el.dataset.field]);
      node[el.dataset.field] = el.textContent + media;
      app.markDirty();
    }
    this.updateStatus();
  }

  onFocusIn(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.path) return;
    this.focusPath = el.dataset.path;
    this.focusField = el.dataset.field || 'content';
    app.updateToolbar(this.focusPath);
    this.updateStatus();
    app.updateSidebar(this.focusPath);
  }

  onKeyDown(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.path) return;
    const path = el.dataset.path;
    const field = el.dataset.field || 'content';

    if (field === 'body') {
      if (e.key === 'Backspace' && el.textContent === '') {
        e.preventDefault();
        this.syncAll();
        app.pushUndo();
        this.deleteBody(path);
      }
      return;
    }

    switch (e.key) {
      case 'Enter':
        e.preventDefault();
        this.syncAll();
        app.pushUndo();
        this.smartEnter(path, el);
        break;
      case 'Tab':
        e.preventDefault();
        this.syncAll();
        app.pushUndo();
        if (e.shiftKey) this.outdentNode(path);
        else this.indentNode(path);
        break;
      case 'Backspace':
        if (el.textContent === '') {
          e.preventDefault();
          this.syncAll();
          app.pushUndo();
          this.deleteNode(path);
        }
        break;
      case 'ArrowUp':
        if (this.getCursorLine(el) === 0) {
          e.preventDefault();
          this.moveFocus(path, -1);
        }
        break;
      case 'ArrowDown':
        if (this.getCursorLine(el) === this.getLineCount(el) - 1) {
          e.preventDefault();
          this.moveFocus(path, 1);
        }
        break;
    }
  }

  getCursorLine() { return 0; }
  getLineCount() { return 1; }

  addSiblingAfter(path) {
    const parts = path.split('.');
    const currentKey = parts[parts.length - 1];
    const level = getLevel(currentKey);
    let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
    const newSeqNum = nextSeq(parent, level);
    const newKey = `t${level}-${newSeqNum}`;
    const newNode = { content: '', hide: 0, hide_body: 0 };
    insertAfter(parent, currentKey, newKey, newNode);
    const newPath = parts.length === 1 ? newKey : parts.slice(0,-1).join('.') + '.' + newKey;
    this.focusPath = newPath;
    this.focusField = 'content';
    this.focusCursorEnd = false;
    this.render(this.data);
    app.markDirty();
  }

  addSiblingBefore(path) {
    const parts = path.split('.');
    const currentKey = parts[parts.length - 1];
    const level = getLevel(currentKey);
    let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
    const newSeqNum = nextSeq(parent, level);
    const newKey = `t${level}-${newSeqNum}`;
    const newNode = { content: '', hide: 0, hide_body: 0 };
    insertBefore(parent, currentKey, newKey, newNode);
    const newPath = parts.length === 1 ? newKey : parts.slice(0,-1).join('.') + '.' + newKey;
    this.focusPath = newPath;
    this.focusField = 'content';
    this.focusCursorEnd = false;
    this.render(this.data);
    app.markDirty();
  }

  smartEnter(path, el) {
    const text = el.textContent || '';
    const offsets = getSelectionOffsetsWithin(el);
    const cursor = offsets ? offsets.start : text.length;
    if (cursor === 0 && text.length > 0) {
      this.addSiblingBefore(path);
    } else if (cursor >= text.length) {
      this.addSiblingAfter(path);
    } else {
      const parts = path.split('.');
      const currentKey = parts[parts.length - 1];
      const node = getNodeByPath(this.data, path);
      const media = extractMediaTags(node.content);
      const before = text.substring(0, cursor);
      const after = text.substring(cursor);
      node.content = before + media;
      const level = getLevel(currentKey);
      let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
      const newSeqNum = nextSeq(parent, level);
      const newKey = `t${level}-${newSeqNum}`;
      const newNode = { content: after, hide: 0, hide_body: 0 };
      insertAfter(parent, currentKey, newKey, newNode);
      const newPath = parts.length === 1 ? newKey : parts.slice(0,-1).join('.') + '.' + newKey;
      this.focusPath = newPath;
      this.focusField = 'content';
      this.focusCursorEnd = false;
      this.render(this.data);
      app.markDirty();
    }
  }

  indentNode(path) {
    const newPath = indentNodeData(this.data, path);
    if (!newPath) return;
    this.focusPath = newPath;
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  outdentNode(path) {
    const newPath = outdentNodeData(this.data, path);
    if (!newPath) return;
    this.focusPath = newPath;
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  deleteNode(path) {
    const parts = path.split('.');
    const currentKey = parts[parts.length - 1];
    const level = getLevel(currentKey);
    let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
    const siblings = getChildTKeys(parent, level);

    // Don't delete the very last root node
    if (parts.length === 1 && getAllTKeys(this.data).length <= 1) return;

    const idx = siblings.indexOf(currentKey);
    const node = parent[currentKey];
    const childKeys = getAllTKeys(node);
    if (childKeys.length > 0) {
      if (!confirm('该节点下有子节点，确定删除？')) return;
    }

    delete parent[currentKey];

    // Focus previous sibling or parent
    if (idx > 0) {
      const prevKey = siblings[idx - 1];
      this.focusPath = parts.length === 1 ? prevKey : parts.slice(0,-1).join('.') + '.' + prevKey;
    } else if (parts.length > 1) {
      this.focusPath = parts.slice(0,-1).join('.');
    } else {
      // Find another root node
      const remaining = getAllTKeys(this.data);
      this.focusPath = remaining.length > 0 ? remaining[0] : null;
    }
    this.focusField = 'content';
    this.focusCursorEnd = true;
    this.render(this.data);
    app.markDirty();
  }

  deleteBody(path) {
    const node = getNodeByPath(this.data, path);
    if (!node) return;
    delete node.body;
    node.hide_body = 0;
    this.focusPath = path;
    this.focusField = 'content';
    this.focusCursorEnd = true;
    this.render(this.data);
    app.markDirty();
  }

  moveFocus(currentPath, direction) {
    const visible = this.getVisiblePaths();
    const idx = visible.indexOf(currentPath);
    if (idx < 0) return;
    const newIdx = idx + direction;
    if (newIdx >= 0 && newIdx < visible.length) {
      this.focusPath = visible[newIdx];
      this.focusField = 'content';
      this.focusCursorEnd = direction > 0 ? false : true;
      this.restoreFocus();
    }
  }

  getVisiblePaths() {
    const paths = [];
    const walk = (obj, prefix) => {
      const tkeys = getAllTKeys(obj);
      for (const k of tkeys) {
        const p = prefix ? prefix + '.' + k : k;
        paths.push(p);
        if (!obj[k].hide) walk(obj[k], p);
      }
    };
    walk(this.data, '');
    return paths;
  }

  restoreFocus() {
    if (!this.focusPath) return;
    const sel = `[data-path="${this.focusPath}"][data-field="${this.focusField}"]`;
    const el = this.el.querySelector(sel);
    if (el) {
      el.focus();
      // Move cursor to end or beginning
      const range = document.createRange();
      const selObj = window.getSelection();
      if (el.childNodes.length > 0) {
        if (this.focusCursorEnd) {
          range.selectNodeContents(el);
          range.collapse(false);
        } else {
          range.selectNodeContents(el);
          range.collapse(true);
        }
        selObj.removeAllRanges();
        selObj.addRange(range);
      }
    }
    this.focusCursorEnd = true;
  }

  updateStatus() {
    let nodeCount = 0, wordCount = 0;
    const countNodes = (obj) => {
      for (const k of getAllTKeys(obj)) {
        nodeCount++;
        wordCount += (obj[k].content || '').length + (obj[k].body || '').length;
        countNodes(obj[k]);
      }
    };
    countNodes(this.data);
    document.getElementById('stat-nodes').textContent = '节点: ' + nodeCount;
    document.getElementById('stat-words').textContent = '字数: ' + wordCount;
    if (this.focusPath) {
      const parts = this.focusPath.split('.');
      const key = parts[parts.length - 1];
      document.getElementById('stat-level').textContent = '层级: ' + getLevel(key);
    }
  }
}

// ================================================================
//  DOCUMENT VIEW
// ================================================================
class DocumentView {
  constructor(container) {
    this.el = container;
    this.focusPath = null;
    this.focusField = 'content';
    this.el.addEventListener('input', e => this.onInput(e));
    this.el.addEventListener('focusin', e => this.onFocusIn(e));
    this.el.addEventListener('keydown', e => this.onKeyDown(e));
  }

  render(data) {
    this.data = data;
    this.el.innerHTML = '';
    const page = document.createElement('div');
    page.className = 'doc-page';
    const tg = data.type_global || {};
    const numStyle = tg.numbering_style || '1.1.1';
    this.counters = {};
    this.renderChildren(data, '', 0, page, numStyle);
    this.el.appendChild(page);
    if (this.focusPath) {
      requestAnimationFrame(() => this.restoreFocus());
    }
  }

  renderChildren(parentObj, parentPath, parentLevel, container, numStyle) {
    const tkeys = getAllTKeys(parentObj);
    for (const key of tkeys) {
      const node = parentObj[key];
      const level = getLevel(key);
      const path = parentPath ? parentPath + '.' + key : key;

      // Count for numbering (skip t0)
      if (level !== 0) {
        const counterKey = parentPath + '|' + level;
        this.counters[counterKey] = (this.counters[counterKey] || 0) + 1;
      }

      const num = this.getNumber(path, numStyle);
      const style = this.getStyle(level, path);

      // Node wrapper
      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'doc-node';
      nodeDiv.dataset.path = path;

      // Fold toggle
      const fold = createFoldToggle(node, path, level, this, 'doc-fold');
      nodeDiv.appendChild(fold);

      // Heading
      const hClass = level === 0 ? 'doc-h1' : (level <= 3 ? `doc-h${level}` : 'doc-h4');
      const heading = document.createElement('div');
      heading.className = hClass;
      this.applyInlineStyle(heading, style);

      // Numbering (skip for t0 and 'none')
      if (level !== 0 && numStyle !== 'none') {
        if (numStyle === 'bullet') {
          const bullet = document.createElement('span');
          bullet.className = 'doc-num';
          const bullets = ['●','○','■','▪'];
          bullet.textContent = bullets[Math.min(level - 1, bullets.length - 1)] + ' ';
          this.applyInlineStyle(bullet, style);
          heading.appendChild(bullet);
        } else if (numStyle === 'bullet-uniform') {
          const bullet = document.createElement('span');
          bullet.className = 'doc-num';
          bullet.textContent = '● ';
          this.applyInlineStyle(bullet, style);
          heading.appendChild(bullet);
        } else {
          const numSpan = document.createElement('span');
          numSpan.className = 'doc-num';
          numSpan.textContent = num;
          this.applyInlineStyle(numSpan, style);
          heading.appendChild(numSpan);
        }
      }

      // Editable content span
      const contentSpan = document.createElement('span');
      contentSpan.className = 'doc-editable';
      contentSpan.contentEditable = 'plaintext-only';
      if (!contentSpan.contentEditable || contentSpan.contentEditable === 'inherit') contentSpan.contentEditable = 'true';
      const contentText = stripMediaTags(node.content || '');
      renderStyledText(contentSpan, contentText, node, 'content', style, (el, runStyle) => this.applyInlineStyle(el, runStyle));
      contentSpan.dataset.path = path;
      contentSpan.dataset.field = 'content';
      contentSpan.dataset.placeholder = level <= 1 ? '输入标题...' : '输入内容...';
      contentSpan.spellcheck = false;
      this.applyInlineStyle(contentSpan, style);
      heading.appendChild(contentSpan);

      // Body button (shared)
      const bodyBtn = createBodyBtn(node, path, this);
      heading.appendChild(bodyBtn);

      nodeDiv.appendChild(heading);

      // Media preview from content
      if (hasMediaTag(node.content || '')) {
        const mediaDiv = document.createElement('div');
        mediaDiv.className = 'media-inline';
        renderTextWithMedia(node.content, mediaDiv, {path, field:'content'});
        nodeDiv.appendChild(mediaDiv);
      }

      // Body
      const hasBody = node.body !== undefined && node.body !== '';
      if (!node.hide_body && (hasBody || (this.focusPath === path && this.focusField === 'body'))) {
        const bodyDiv = document.createElement('div');
        bodyDiv.className = 'doc-body doc-editable';
        bodyDiv.contentEditable = 'plaintext-only';
        if (!bodyDiv.contentEditable || bodyDiv.contentEditable === 'inherit') bodyDiv.contentEditable = 'true';
        const bodyStyle = this.getBodyStyle(path);
        const bodyText = stripMediaTags(node.body || '');
        renderStyledText(bodyDiv, bodyText, node, 'body', bodyStyle, (el, runStyle) => this.applyInlineStyle(el, runStyle));
        bodyDiv.dataset.path = path;
        bodyDiv.dataset.field = 'body';
        bodyDiv.spellcheck = false;
        this.applyInlineStyle(bodyDiv, bodyStyle);
        nodeDiv.appendChild(bodyDiv);

        // Media preview from body
        if (hasMediaTag(node.body || '')) {
          const bodyMediaDiv = document.createElement('div');
          bodyMediaDiv.className = 'media-inline';
          renderTextWithMedia(node.body, bodyMediaDiv, {path, field:'body'});
          nodeDiv.appendChild(bodyMediaDiv);
        }
      }

      container.appendChild(nodeDiv);

      // Recurse (skip if folded)
      if (!node.hide) {
        this.renderChildren(node, path, level, container, numStyle);
      }
    }
  }

  getNumber(path, numStyle) {
    const parts = path.split('.');
    const nums = [];
    let obj = this.data;
    for (const part of parts) {
      const level = getLevel(part);
      if (level === 0) { obj = obj[part]; continue; }
      const siblings = getChildTKeys(obj, level);
      const idx = siblings.indexOf(part);
      nums.push(idx + 1);
      obj = obj[part];
    }
    if (nums.length === 0) return '';
    if (numStyle === '1.1.1') return nums.join('.');
    if (numStyle === '一.1.1') {
      const cn = ['零','一','二','三','四','五','六','七','八','九','十',
                   '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
      const first = cn[nums[0]] || nums[0];
      return nums.length === 1 ? first : first + '.' + nums.slice(1).join('.');
    }
    if (numStyle === 'I.A.1') {
      const roman = ['','I','II','III','IV','V','VI','VII','VIII','IX','X'];
      const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      let result = '';
      if (nums[0]) result = roman[nums[0]] || nums[0];
      if (nums[1]) result += '.' + (alpha[nums[1]-1] || nums[1]);
      if (nums[2]) result += '.' + nums[2];
      for (let i = 3; i < nums.length; i++) result += '.' + nums[i];
      return result;
    }
    return nums.join('.');
  }

  getStyle(level, path) {
    return buildNodeStyle(this.data, path, level, { isBody: false });
  }

  getBodyStyle(path) {
    return buildNodeStyle(this.data, path, undefined, { isBody: true });
  }

  applyInlineStyle(el, style) {
    applyFmtStyle(el, style, app && app.documentFmt ? app.documentFmt : {});
  }

  // Sync all editable elements to data
  syncAll() {
    this.el.querySelectorAll('[data-path][data-field]').forEach(el => {
      const node = getNodeByPath(this.data, el.dataset.path);
      if (!node) return;
      const field = el.dataset.field;
      const media = extractMediaTags(node[field]);
      node[field] = el.textContent + media;
    });
  }

  onInput(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.path || !el.dataset.field) return;
    const node = getNodeByPath(this.data, el.dataset.path);
    if (node) {
      const media = extractMediaTags(node[el.dataset.field]);
      node[el.dataset.field] = el.textContent + media;
      app.markDirty();
    }
  }

  onFocusIn(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.path) return;
    this.focusPath = el.dataset.path;
    this.focusField = el.dataset.field || 'content';
    app.updateToolbar(this.focusPath);
    app.updateSidebar(this.focusPath);
  }

  onKeyDown(e) {
    const el = e.target;
    if (!el.dataset || !el.dataset.path) return;
    const path = el.dataset.path;
    const field = el.dataset.field || 'content';

    if (field === 'body') {
      if (e.key === 'Backspace' && el.textContent === '') {
        e.preventDefault();
        this.syncAll();
        app.pushUndo();
        this.deleteBody(path);
      }
      return;
    }

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      this.syncAll();
      app.pushUndo();
      this.smartEnter(path, el);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      this.syncAll();
      app.pushUndo();
      if (e.shiftKey) this.outdentNode(path);
      else this.indentNode(path);
    } else if (e.key === 'Backspace' && el.textContent === '') {
      e.preventDefault();
      this.syncAll();
      app.pushUndo();
      this.deleteNode(path);
    }
  }

  addSiblingAfter(path) {
    const parts = path.split('.');
    const currentKey = parts[parts.length - 1];
    const level = getLevel(currentKey);
    let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
    const newSeqNum = nextSeq(parent, level);
    const newKey = `t${level}-${newSeqNum}`;
    insertAfter(parent, currentKey, newKey, { content: '', hide: 0, hide_body: 0 });
    this.focusPath = parts.length === 1 ? newKey : parts.slice(0,-1).join('.') + '.' + newKey;
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  addSiblingBefore(path) {
    const parts = path.split('.');
    const currentKey = parts[parts.length - 1];
    const level = getLevel(currentKey);
    let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
    const newSeqNum = nextSeq(parent, level);
    const newKey = `t${level}-${newSeqNum}`;
    insertBefore(parent, currentKey, newKey, { content: '', hide: 0, hide_body: 0 });
    this.focusPath = parts.length === 1 ? newKey : parts.slice(0,-1).join('.') + '.' + newKey;
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  smartEnter(path, el) {
    const text = el.textContent || '';
    const offsets = getSelectionOffsetsWithin(el);
    const cursor = offsets ? offsets.start : text.length;
    if (cursor === 0 && text.length > 0) {
      this.addSiblingBefore(path);
    } else if (cursor >= text.length) {
      this.addSiblingAfter(path);
    } else {
      const parts = path.split('.');
      const currentKey = parts[parts.length - 1];
      const node = getNodeByPath(this.data, path);
      const media = extractMediaTags(node.content);
      node.content = text.substring(0, cursor) + media;
      const level = getLevel(currentKey);
      let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
      const newSeqNum = nextSeq(parent, level);
      const newKey = `t${level}-${newSeqNum}`;
      insertAfter(parent, currentKey, newKey, { content: text.substring(cursor), hide: 0, hide_body: 0 });
      this.focusPath = parts.length === 1 ? newKey : parts.slice(0,-1).join('.') + '.' + newKey;
      this.focusField = 'content';
      this.render(this.data);
      app.markDirty();
    }
  }

  deleteNode(path) {
    const parts = path.split('.');
    const currentKey = parts[parts.length - 1];
    const level = getLevel(currentKey);
    let parent = parts.length === 1 ? this.data : getNodeByPath(this.data, parts.slice(0,-1).join('.'));
    if (parts.length === 1 && getAllTKeys(this.data).length <= 1) return;
    const siblings = getChildTKeys(parent, level);
    const idx = siblings.indexOf(currentKey);
    const node = parent[currentKey];
    if (getAllTKeys(node).length > 0 && !confirm('该节点下有子节点，确定删除？')) return;
    delete parent[currentKey];
    if (idx > 0) {
      this.focusPath = parts.length === 1 ? siblings[idx - 1] : parts.slice(0,-1).join('.') + '.' + siblings[idx - 1];
    } else if (parts.length > 1) {
      this.focusPath = parts.slice(0,-1).join('.');
    } else {
      const remaining = getAllTKeys(this.data);
      this.focusPath = remaining.length > 0 ? remaining[0] : null;
    }
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  deleteBody(path) {
    const node = getNodeByPath(this.data, path);
    if (!node) return;
    delete node.body;
    node.hide_body = 0;
    this.focusPath = path;
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  indentNode(path) {
    const newPath = indentNodeData(this.data, path);
    if (!newPath) return;
    this.focusPath = newPath;
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  outdentNode(path) {
    const newPath = outdentNodeData(this.data, path);
    if (!newPath) return;
    this.focusPath = newPath;
    this.focusField = 'content';
    this.render(this.data);
    app.markDirty();
  }

  restoreFocus() {
    if (!this.focusPath) return;
    const sel = `[data-path="${this.focusPath}"][data-field="${this.focusField}"]`;
    const el = this.el.querySelector(sel);
    if (el) {
      el.focus();
      const range = document.createRange();
      const selObj = window.getSelection();
      if (el.childNodes.length > 0) {
        range.selectNodeContents(el);
        range.collapse(false);
        selObj.removeAllRanges();
        selObj.addRange(range);
      }
    }
  }
}

// ================================================================
//  FILE MANAGER
// ================================================================
async function createUDDBlob(data) {
  const zip = new JSZip();
  const bottom = compressData(data);
  zip.file('data.json', JSON.stringify(bottom, null, 2));
  const meta = data.meta || {};
  zip.file('meta.json', JSON.stringify({
    format_version: '1.0', app_version: '1.0.0',
    title: meta.title || '', author: meta.author || '',
    created: meta.created || '', modified: new Date().toISOString()
  }, null, 2));
  zip.file('view_state.json', JSON.stringify({ last_view: 'outline' }, null, 2));
  return await zip.generateAsync({ type: 'blob' });
}

async function parseUDDBlob(blob) {
  const zip = await JSZip.loadAsync(blob);
  const dataFile = zip.file('data.json');
  if (!dataFile) throw new Error('无效的 .udd 文件：缺少 data.json');
  const json = await dataFile.async('string');
  const bottom = JSON.parse(json);
  return decompressData(bottom);
}

// ================================================================
//  APP CONTROLLER
// ================================================================
class App {
  constructor() {
    this.data = createDefaultData();
    this.currentView = 'outline';
    this.dirty = false;
    this.fileHandle = null;
    this.fileName = '未命名文档';
    this.undoMgr = new UndoManager();
    this.outlineView = new OutlineView(document.getElementById('outline-view'));
    this.documentView = new DocumentView(document.getElementById('document-view'));
    this.lastFgColor = '#1e293b';
    this.lastBgColor = '#ffffff';
    this.savedSelection = null;

    // Format switches
    this.outlineFmt = { font: true, font_size: true, color: true, bold: true,
      italic: false, underline: false, strikethrough: false, background_color: false, text_align: false };
    this.documentFmt = { font: true, font_size: true, color: true, bold: true,
      italic: true, underline: true, strikethrough: true, background_color: true, text_align: true };
    this.initFmtSwitches();

    // Auto-save
    this.autoSaveTimer = setInterval(() => this.autoSave(), 30000);

    // Keyboard shortcuts
    document.addEventListener('keydown', e => this.onGlobalKey(e));

    // Close palettes on outside click
    document.addEventListener('click', e => {
      if (!e.target.closest('.tool-color-wrap')) this.closeAllPalettes();
    });

    // Save selection before it's lost by toolbar clicks
    document.addEventListener('selectionchange', () => {
      const el = this.getActiveEditableEl();
      if (!el) return;
      const sel = getSelectionOffsetsWithin(el);
      if (sel && sel.end > sel.start) this.savedSelection = sel;
    });

    // Doc title
    document.getElementById('doc-title').addEventListener('input', e => {
      this.data.meta.title = e.target.value;
      this.fileName = e.target.value || '未命名文档';
      document.title = 'UDD - ' + this.fileName;
      this.markDirty();
    });

    this.undoMgr.push(this.data);
    this.initColorPalettes();
  }

  async init() {

    // Try restore from IndexedDB
    try {
      const saved = await dbLoad('current');
      if (saved && saved.data) {
        this.data = saved.data;
        this.fileName = this.data.meta?.title || '未命名文档';
        document.getElementById('doc-title').value = this.fileName;
        document.title = 'UDD - ' + this.fileName;
        this.undoMgr.push(this.data);
        toast('已恢复上次编辑');
      }
    } catch (e) { /* ignore */ }
    this.renderCurrentView();
  }

  renderCurrentView() {
    if (this.currentView === 'outline') {
      this.outlineView.render(this.data);
    } else {
      this.documentView.render(this.data);
    }
  }

  switchView(view) {
    if (this.currentView === 'outline') this.outlineView.syncAll();
    else if (this.currentView === 'document') this.documentView.syncAll();
    this.currentView = view;
    document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    document.getElementById('outline-view').classList.toggle('active', view === 'outline');
    document.getElementById('document-view').classList.toggle('active', view === 'document');
    this.syncFmtCheckboxes();
    this.renderCurrentView();
  }

  getCurrentFocusPath() {
    const view = this.currentView === 'outline' ? this.outlineView : this.documentView;
    return view.focusPath;
  }

  getCurrentFocusField() {
    const view = this.currentView === 'outline' ? this.outlineView : this.documentView;
    return view.focusField || 'content';
  }

  getActiveEditableEl() {
    const path = this.getCurrentFocusPath();
    const field = this.getCurrentFocusField();
    if (!path || !field) return null;
    const view = this.currentView === 'outline' ? this.outlineView : this.documentView;
    return view.el.querySelector(`[data-path="${path}"][data-field="${field}"]`);
  }

  getCurrentTextSelection() {
    const el = this.getActiveEditableEl();
    if (!el) return this.savedSelection;
    return getSelectionOffsetsWithin(el) || this.savedSelection;
  }

  toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const btn = document.getElementById('sidebar-toggle');
    sb.classList.toggle('active');
    btn.classList.toggle('active');
    if (sb.classList.contains('active')) {
      this.updateSidebar(this.outlineView.focusPath);
    }
  }

  updateSidebar(path) {
    if (!document.getElementById('sidebar').classList.contains('active')) return;
    const json = document.getElementById('sidebar-json');
    if (path && path.indexOf('.') !== -1) {
      const node = getNodeByPath(this.data, path);
      // Wrap with path key for context
      const parts = path.split('.');
      const key = parts[parts.length - 1];
      const wrapped = {};
      wrapped[key] = node;
      json.value = JSON.stringify(wrapped, null, 2);
      json.dataset.path = path;
    } else {
      // Top-level key or no path: show complete raw data
      json.value = JSON.stringify(this.data, null, 2);
      json.dataset.path = '';
    }
  }

  applySidebarJSON() {
    const json = document.getElementById('sidebar-json');
    const path = json.dataset.path;
    try {
      const parsed = JSON.parse(json.value);
      this.pushUndo();
      if (path) {
        const { parent, key } = getParentAndKey(this.data, path);
        // Handle wrapped format: { "t1-1": {...} }
        if (parsed[key] !== undefined) {
          parent[key] = parsed[key];
        } else {
          parent[key] = parsed;
        }
      } else {
        this.data = parsed;
      }
      this.renderCurrentView();
      this.markDirty();
      toast('已应用修改');
    } catch (e) {
      toast('JSON 格式错误: ' + e.message);
    }
  }

  updateToolbar(path) {
    if (!path) return;
    const level = getLevel(path.split('.').pop());
    const isBody = this.getCurrentFocusField() === 'body';
    const style = buildNodeStyle(this.data, path, level, { isBody });

    if (style.font) document.getElementById('tool-font').value = style.font;
    if (style.font_size) document.getElementById('tool-size').value = style.font_size;
    document.getElementById('tool-bold').classList.toggle('active', !!style.bold);
    document.getElementById('tool-italic').classList.toggle('active', !!style.italic);
    document.getElementById('tool-underline').classList.toggle('active', !!style.underline);
    document.getElementById('tool-strike').classList.toggle('active', !!style.strikethrough);
    if (style.color) {
      const hex = rgbToHex(String(style.color));
      this.lastFgColor = hex;
      document.getElementById('tool-color-preview').style.background = hex;
    }
    if (style.background_color) {
      const hex = rgbToHex(String(style.background_color));
      this.lastBgColor = hex;
      document.getElementById('tool-bg-preview').style.background = hex;
    }
    const align = style.text_align;
    document.getElementById('tool-align-left').classList.toggle('active', align === 'left' || !align);
    document.getElementById('tool-align-center').classList.toggle('active', align === 'center');
    document.getElementById('tool-align-right').classList.toggle('active', align === 'right');
  }

  setNodeStyle(field, value) {
    this.applyStyleChange(field, value, { mode: 'set' });
  }

  toggleStyle(field) {
    this.applyStyleChange(field, null, { mode: 'toggle' });
  }

  applyStyleChange(field, value, opts = {}) {
    const path = this.getCurrentFocusPath();
    if (!path) return;
    this.pushUndo();
    const node = getNodeByPath(this.data, path);
    if (!node) return;
    const focusField = this.getCurrentFocusField();
    const key = focusField === 'body' ? `body.${field}` : field;
    const level = getLevel(path.split('.').pop());
    const isBody = focusField === 'body';
    const style = buildNodeStyle(this.data, path, level, { isBody });
    const baseValue = style[field];
    const selection = this.getCurrentTextSelection();
    this.savedSelection = null;
    const canRange = RANGEABLE_STYLE_FIELDS.has(field);
    const isTextField = focusField === 'content' || focusField === 'body';
    if (selection && selection.end > selection.start && canRange && isTextField) {
      const rawText = node[focusField] || '';
      const text = stripMediaTags(rawText);
      const textLength = text.length;
      let targetValue = value;
      if (opts.mode === 'toggle') {
        const descriptor = getRangeStyleDescriptor(node[key], baseValue);
        const uniform = getValueForRange(descriptor, selection.start, selection.end);
        const enabled = !!uniform;
        targetValue = enabled ? 0 : 1;
      }
      node[key] = applyRangeStyleValue(node[key], targetValue, selection, baseValue, textLength);
    } else if (opts.mode === 'toggle') {
      const current = node[key];
      const resolved = current !== undefined ? resolveStyleBaseValue(current) : baseValue;
      node[key] = resolved ? 0 : 1;
    } else {
      node[key] = value;
    }
    this.renderCurrentView();
    this.markDirty();
  }

  setColor(hex) {
    this.lastFgColor = hex;
    document.getElementById('tool-color-preview').style.background = hex;
    this.setNodeStyle('color', hexToRgb(hex));
  }

  setBgColor(hex) {
    this.lastBgColor = hex;
    document.getElementById('tool-bg-preview').style.background = hex;
    this.setNodeStyle('background_color', hexToRgb(hex));
  }

  applyLastColor(type) {
    if (type === 'fg') this.setColor(this.lastFgColor);
    else this.setBgColor(this.lastBgColor);
  }

  // Color palette
  initColorPalettes() {
    this.buildPalette('palette-fg', 'fg');
    this.buildPalette('palette-bg', 'bg');
  }

  buildPalette(containerId, type) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const grid = document.createElement('div');
    grid.className = 'color-palette-grid';
    for (const color of PALETTE_COLORS) {
      const span = document.createElement('span');
      span.style.background = color;
      span.onclick = (e) => {
        e.stopPropagation();
        if (type === 'fg') this.setColor(color);
        else this.setBgColor(color);
        this.closeAllPalettes();
      };
      grid.appendChild(span);
    }
    container.appendChild(grid);
    const custom = document.createElement('div');
    custom.className = 'color-palette-custom';
    custom.innerHTML = '自定义: ';
    const input = document.createElement('input');
    input.type = 'color';
    input.value = type === 'fg' ? this.lastFgColor : this.lastBgColor;
    input.onchange = (e) => {
      if (type === 'fg') this.setColor(e.target.value);
      else this.setBgColor(e.target.value);
      this.closeAllPalettes();
    };
    custom.appendChild(input);
    container.appendChild(custom);
  }

  toggleColorPalette(type) {
    const id = type === 'fg' ? 'palette-fg' : 'palette-bg';
    const el = document.getElementById(id);
    const otherId = type === 'fg' ? 'palette-bg' : 'palette-fg';
    document.getElementById(otherId)?.classList.remove('show');
    if (el) {
      const isShowing = el.classList.toggle('show');
      if (isShowing) {
        const wrapId = type === 'fg' ? 'color-wrap-fg' : 'color-wrap-bg';
        const wrap = document.getElementById(wrapId);
        const rect = wrap.getBoundingClientRect();
        el.style.top = rect.bottom + 2 + 'px';
        el.style.left = rect.left + 'px';
      }
    }
  }

  closeAllPalettes() {
    document.querySelectorAll('.color-palette').forEach(p => p.classList.remove('show'));
  }

  // Format switches
  initFmtSwitches() {
    const container = document.getElementById('fmt-switches');
    if (!container) return;
    this.syncFmtCheckboxes();
    container.querySelectorAll('input[data-fmt]').forEach(cb => {
      cb.onchange = () => {
        const fmt = this.currentView === 'outline' ? this.outlineFmt : this.documentFmt;
        fmt[cb.dataset.fmt] = cb.checked;
        this.renderCurrentView();
      };
    });
  }

  syncFmtCheckboxes() {
    const fmt = this.currentView === 'outline' ? this.outlineFmt : this.documentFmt;
    document.querySelectorAll('#fmt-switches input[data-fmt]').forEach(cb => {
      cb.checked = !!fmt[cb.dataset.fmt];
    });
  }

  // Media insert
  async insertMedia() {
    const nodePath = this.getCurrentFocusPath();
    if (!nodePath) { toast('请先选中一个节点'); return; }
    try {
      // Step 1: pick directory
      const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
      // Step 2: pick file from that directory
      const [fileHandle] = await window.showOpenFilePicker({
        types: [{ description: '媒体文件', accept: { 'image/*': [], 'video/*': [] } }]
      });
      // Step 3: resolve relative path from dir to file
      const relParts = await dirHandle.resolve(fileHandle);
      if (!relParts) { toast('所选文件不在该目录下'); return; }
      // Step 4: get dir absolute path (cached per dirHandle.name in localStorage)
      const cacheKey = 'media_dir_' + dirHandle.name;
      let dirPath = localStorage.getItem(cacheKey);
      if (!dirPath) {
        dirPath = prompt('首次使用该目录，请输入其绝对路径：', 'E:\\' + dirHandle.name);
        if (!dirPath) return;
        localStorage.setItem(cacheKey, dirPath);
      }
      // Step 5: build absolute path
      const absPath = dirPath.replace(/[\\/]$/, '') + '\\' + relParts.join('\\');
      const file = await fileHandle.getFile();
      const isVideo = file.type.startsWith('video/');
      const mediaType = isVideo ? 'video' : 'image';
      // Cache blob URL for current session preview
      if (!this._mediaBlobUrls) this._mediaBlobUrls = {};
      this._mediaBlobUrls[absPath] = URL.createObjectURL(file);
      const tag = `{{"${mediaType}":"${absPath.replace(/\\/g, '\\\\')}","${mediaType}.width":"100%"}}`;
      this.pushUndo();
      const node = getNodeByPath(this.data, nodePath);
      if (!node) return;
      const field = this.currentView === 'outline'
        ? (this.outlineView.focusField || 'body')
        : (this.documentView.focusField || 'body');
      if (field === 'body') {
        node.body = (node.body || '') + tag;
        node.hide_body = 0;
      } else {
        node.content = (node.content || '') + tag;
      }
      this.renderCurrentView();
      this.markDirty();
      toast('已插入' + (isVideo ? '视频' : '图片'));
    } catch (e) {
      if (e.name !== 'AbortError') toast('插入失败：' + e.message);
    }
  }

  resolveMediaSrc(src) {
    if (this._mediaBlobUrls && this._mediaBlobUrls[src]) return this._mediaBlobUrls[src];
    if (src.startsWith('http') || src.startsWith('data:') || src.startsWith('blob:') || src.startsWith('file:')) return src;
    // Convert absolute path (e.g. E:\xxx\yyy.jpg) to file:/// URL
    if (/^[A-Za-z]:[\\/]/.test(src)) return 'file:///' + src.replace(/\\/g, '/');
    return src;
  }

  setNumbering(style) {
    this.pushUndo();
    this.data.type_global.numbering_style = style;
    this.renderCurrentView();
    this.markDirty();
  }

  // Undo / Redo
  pushUndo() { this.undoMgr.push(this.data); }
  undo() {
    if (this.currentView === 'outline') this.outlineView.syncAll();
    else if (this.currentView === 'document') this.documentView.syncAll();
    const d = this.undoMgr.undo();
    if (d) { this.data = d; this.renderCurrentView(); this.markDirty(); toast('撤销'); }
  }
  redo() {
    const d = this.undoMgr.redo();
    if (d) { this.data = d; this.renderCurrentView(); this.markDirty(); toast('重做'); }
  }

  // Dirty / save state
  markDirty() {
    this.dirty = true;
    document.getElementById('stat-save').textContent = '● 未保存';
    document.getElementById('stat-save').style.color = '#ef4444';
    this.debouncedAutoSave();
  }
  markClean() {
    this.dirty = false;
    document.getElementById('stat-save').textContent = '✓ 已保存';
    document.getElementById('stat-save').style.color = '#22c55e';
  }

  debouncedAutoSave = debounce(() => this.autoSave(), 5000);

  async autoSave() {
    if (!this.dirty) return;
    if (this.currentView === 'outline') this.outlineView.syncAll();
    else if (this.currentView === 'document') this.documentView.syncAll();
    this.data.meta.modified = new Date().toISOString();
    try {
      await dbSave('current', this.data);
      this.markClean();
    } catch (e) { console.error('Auto-save failed:', e); }
  }

  // File operations
  async newFile() {
    if (this.dirty && !confirm('当前文档未保存，是否新建？')) return;
    this.data = createDefaultData();
    this.fileHandle = null;
    this.fileName = '未命名文档';
    document.getElementById('doc-title').value = this.fileName;
    document.title = 'UDD - ' + this.fileName;
    this.undoMgr = new UndoManager();
    this.undoMgr.push(this.data);
    this.outlineView.focusPath = 't1-1';
    this.renderCurrentView();
    this.markDirty();
    toast('已新建文档');
  }

  async openFile() {
    try {
      let file;
      if (window.showOpenFilePicker) {
        const [handle] = await window.showOpenFilePicker({
          types: [
            { description: 'UDD文档', accept: { 'application/zip': ['.udd'] } },
            { description: 'JSON文件', accept: { 'application/json': ['.json'] } }
          ]
        });
        this.fileHandle = handle;
        file = await handle.getFile();
      } else {
        file = await new Promise(resolve => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = '.udd,.json';
          input.onchange = () => resolve(input.files[0]);
          input.click();
        });
      }

      if (!file) return;

      if (file.name.endsWith('.json')) {
        const text = await file.text();
        this.data = JSON.parse(text);
      } else {
        this.data = await parseUDDBlob(file);
      }

      this.fileName = this.data.meta?.title || file.name.replace(/\.(udd|json)$/, '');
      document.getElementById('doc-title').value = this.fileName;
      document.title = 'UDD - ' + this.fileName;
      this.undoMgr = new UndoManager();
      this.undoMgr.push(this.data);
      this.outlineView.focusPath = null;
      this.renderCurrentView();
      this.markClean();
      toast('已打开: ' + file.name);
    } catch (e) {
      if (e.name !== 'AbortError') toast('打开失败: ' + e.message);
    }
  }

  async saveFile() {
    if (this.currentView === 'outline') this.outlineView.syncAll();
    else if (this.currentView === 'document') this.documentView.syncAll();
    this.data.meta.modified = new Date().toISOString();
    this.data.meta.title = this.fileName;

    try {
      if (this.fileHandle) {
        const blob = await createUDDBlob(this.data);
        const writable = await this.fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();
        this.markClean();
        toast('已保存');
      } else {
        await this.saveFileAs();
      }
    } catch (e) {
      if (e.name !== 'AbortError') toast('保存失败: ' + e.message);
    }
  }

  async saveFileAs() {
    if (this.currentView === 'outline') this.outlineView.syncAll();
    else if (this.currentView === 'document') this.documentView.syncAll();
    this.data.meta.modified = new Date().toISOString();
    this.data.meta.title = this.fileName;

    try {
      const blob = await createUDDBlob(this.data);
      if (window.showSaveFilePicker) {
        const handle = await window.showSaveFilePicker({
          suggestedName: this.fileName + '.udd',
          types: [{ description: 'UDD文档', accept: { 'application/zip': ['.udd'] } }]
        });
        this.fileHandle = handle;
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
      } else {
        // Fallback download
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = this.fileName + '.udd';
        a.click(); URL.revokeObjectURL(url);
      }
      this.markClean();
      toast('已保存');
    } catch (e) {
      if (e.name !== 'AbortError') toast('保存失败: ' + e.message);
    }
  }

  async exportJSON() {
    if (this.currentView === 'outline') this.outlineView.syncAll();
    else if (this.currentView === 'document') this.documentView.syncAll();
    const json = JSON.stringify(this.data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = this.fileName + '.json';
    a.click(); URL.revokeObjectURL(url);
    toast('已导出 JSON');
  }

  async importJSON() {
    try {
      const file = await new Promise(resolve => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = '.json';
        input.onchange = () => resolve(input.files[0]);
        input.click();
      });
      if (!file) return;
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.meta && !data.type_global) {
        toast('JSON 不符合 UDD 数据格式'); return;
      }
      this.pushUndo();
      this.data = data;
      this.fileName = data.meta?.title || '导入文档';
      document.getElementById('doc-title').value = this.fileName;
      document.title = 'UDD - ' + this.fileName;
      this.renderCurrentView();
      this.markDirty();
      toast('已导入');
    } catch (e) {
      toast('导入失败: ' + e.message);
    }
  }

  // Global keyboard shortcuts
  onGlobalKey(e) {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && e.key === 's') { e.preventDefault(); this.saveFile(); }
    if (ctrl && e.key === 'n') { e.preventDefault(); this.newFile(); }
    if (ctrl && e.key === 'o') { e.preventDefault(); this.openFile(); }
    if (ctrl && e.key === 'z' && !e.shiftKey) { e.preventDefault(); this.undo(); }
    if (ctrl && e.key === 'z' && e.shiftKey) { e.preventDefault(); this.redo(); }
    if (ctrl && e.key === 'Z') { e.preventDefault(); this.redo(); }
    if (ctrl && e.key === '\\') { e.preventDefault(); this.toggleSidebar(); }
    if (ctrl && e.key === '1') { e.preventDefault(); this.switchView('outline'); }
    if (ctrl && e.key === '2') { e.preventDefault(); this.switchView('document'); }
    if (ctrl && e.key === 'b') { e.preventDefault(); this.toggleStyle('bold'); }
    if (ctrl && e.key === 'i') { e.preventDefault(); this.toggleStyle('italic'); }
    if (ctrl && e.key === 'u') { e.preventDefault(); this.toggleStyle('underline'); }
  }
}

    icons: [{

      sizes: '64x64', type: 'image/svg+xml'
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

// ================================================================
//  INITIALIZATION
// ================================================================
let app;
document.addEventListener('DOMContentLoaded', () => {
  app = new App();
  app.init();
});

// Prevent accidental close
window.addEventListener('beforeunload', e => {
  if (app && app.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});
