<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UDD - 统一数据展示系统</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;--blue-300:#93c5fd;
  --blue-500:#3b82f6;--blue-600:#2563eb;--blue-700:#1d4ed8;--blue-800:#1e40af;
  --gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-300:#cbd5e1;
  --gray-400:#94a3b8;--gray-500:#64748b;--gray-600:#475569;--gray-700:#334155;
  --gray-800:#1e293b;--gray-900:#0f172a;
  --bg:#ffffff;--border:var(--gray-200);--text:var(--gray-800);
  --text-sec:var(--gray-500);--primary:var(--blue-600);--primary-h:var(--blue-700);
  --primary-l:var(--blue-50);--radius:6px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;font-size:14px;color:var(--text);background:var(--gray-100)}

/* ===== LAYOUT ===== */
#app{display:flex;flex-direction:column;height:100%;background:var(--bg)}
#header{flex-shrink:0;border-bottom:1px solid var(--border);background:var(--bg)}
#menu-bar{display:flex;align-items:center;height:40px;padding:0 12px;gap:2px;border-bottom:1px solid var(--gray-100)}
#menu-bar .logo{font-weight:700;font-size:15px;color:var(--primary);margin-right:12px;letter-spacing:1px}
#menu-bar .doc-title{flex:1;font-size:13px;color:var(--gray-600);border:none;background:none;outline:none;padding:4px 8px;border-radius:var(--radius);min-width:120px}
#menu-bar .doc-title:hover{background:var(--gray-50)}
#menu-bar .doc-title:focus{background:var(--blue-50);color:var(--text)}
.menu-btn{background:none;border:none;padding:4px 10px;font-size:13px;color:var(--gray-600);cursor:pointer;border-radius:var(--radius);white-space:nowrap}
.menu-btn:hover{background:var(--gray-100);color:var(--text)}
.menu-btn.primary{color:var(--primary);font-weight:600}
.menu-sep{width:1px;height:18px;background:var(--gray-200);margin:0 4px}

#toolbar{display:flex;align-items:center;height:38px;padding:0 12px;gap:2px;overflow-x:auto}
.tool-btn{background:none;border:1px solid transparent;width:32px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:var(--radius);font-size:14px;color:var(--gray-600)}
.tool-btn:hover{background:var(--gray-100);border-color:var(--gray-200)}
.tool-btn.active{background:var(--blue-50);color:var(--primary);border-color:var(--blue-200)}
.tool-select{height:28px;border:1px solid var(--gray-200);border-radius:var(--radius);padding:0 6px;font-size:12px;color:var(--text);background:var(--bg);cursor:pointer;outline:none}
.tool-select:hover{border-color:var(--gray-300)}
.tool-select:focus{border-color:var(--primary)}
.tool-color{width:28px;height:28px;border:1px solid var(--gray-200);border-radius:var(--radius);cursor:pointer;padding:2px;background:var(--bg)}
.tool-color::-webkit-color-swatch-wrapper{padding:0}
.tool-color::-webkit-color-swatch{border:none;border-radius:3px}
.tool-sep{width:1px;height:20px;background:var(--gray-200);margin:0 4px;flex-shrink:0}

#view-tabs{display:flex;align-items:center;height:34px;padding:0 12px;gap:0;background:var(--gray-50);border-bottom:1px solid var(--border)}
.view-tab{background:none;border:none;padding:6px 16px;font-size:13px;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.view-tab:hover{color:var(--text)}
.view-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
#view-tabs .spacer{flex:1}
#sidebar-toggle{background:none;border:1px solid var(--gray-200);padding:3px 10px;font-size:12px;color:var(--gray-500);cursor:pointer;border-radius:var(--radius)}
#sidebar-toggle:hover{background:var(--gray-100);color:var(--text)}
#sidebar-toggle.active{background:var(--blue-50);color:var(--primary);border-color:var(--blue-200)}

#main{flex:1;display:flex;overflow:hidden}
#editor{flex:1;overflow:auto;position:relative}
#outline-view{padding:16px 20px 80px 20px;display:none;max-width:960px;margin:0 auto}
#outline-view.active{display:block}
#document-view{display:none;padding:20px}
#document-view.active{display:block}

#sidebar{width:340px;border-left:1px solid var(--border);display:none;flex-direction:column;background:var(--bg)}
#sidebar.active{display:flex}
#sidebar .sidebar-header{padding:10px 14px;font-size:13px;font-weight:600;color:var(--gray-600);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
#sidebar .sidebar-header button{background:none;border:none;cursor:pointer;color:var(--gray-400);font-size:16px}
#sidebar .sidebar-header button:hover{color:var(--text)}
#sidebar-content{flex:1;overflow:auto;padding:8px}
#sidebar-json{width:100%;height:100%;border:none;resize:none;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:12px;line-height:1.5;color:var(--gray-700);outline:none;padding:8px;background:var(--gray-50);border-radius:var(--radius)}

#status-bar{height:26px;display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--text-sec);border-top:1px solid var(--border);background:var(--bg);gap:16px;flex-shrink:0}
#status-bar .sep{width:1px;height:12px;background:var(--gray-200)}

/* ===== OUTLINE VIEW ===== */
.outline-node{position:relative}
.outline-row{display:flex;align-items:flex-start;padding:2px 0;min-height:28px;border-radius:var(--radius)}
.outline-row:hover{background:var(--gray-50)}
.outline-row .indent{flex-shrink:0}
.outline-arrow{width:22px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:11px;flex-shrink:0;border-radius:var(--radius);user-select:none;margin-top:1px}
.outline-row:hover .outline-arrow{color:var(--gray-400)}
.outline-row:hover .outline-arrow:hover{background:var(--gray-200);color:var(--text)}
.outline-arrow.leaf{cursor:default;font-size:6px}
.outline-arrow.leaf:hover{background:transparent}
.outline-content-wrap{display:flex;align-items:baseline;flex:1;min-width:0}
.outline-num{font-weight:400;font-size:90%;margin-right:6px;flex-shrink:0;white-space:nowrap}
.outline-content{flex:0 1 auto;padding:2px 6px;line-height:1.6;outline:none;border-radius:3px;min-height:24px;word-break:break-word;max-width:calc(100% - 60px)}
.outline-content:focus{background:var(--blue-50)}
.outline-content:empty::before{content:attr(data-placeholder);color:var(--gray-300);pointer-events:none}
.body-btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gray-300);font-size:15px;border-radius:3px;flex-shrink:0;margin-left:3px;padding:2px 4px;line-height:1;user-select:none}
.body-btn:hover{background:var(--gray-200);color:var(--gray-500)}
.outline-body{padding:3px 6px;margin-left:22px;color:var(--gray-500);font-size:13px;line-height:1.5;outline:none;border-left:2px solid var(--gray-200);border-radius:0 3px 3px 0;min-height:20px;word-break:break-word}
.outline-body:focus{background:var(--blue-50);border-left-color:var(--primary)}
.outline-body:empty::before{content:'输入正文...';color:var(--gray-300);pointer-events:none}
.outline-children{margin-left:0}

/* ===== FORMAT SWITCHES ===== */
.fmt-sw{display:flex;align-items:center;gap:6px;padding:0 12px 4px;flex-wrap:wrap}
.fmt-sw label{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--gray-400);cursor:pointer;user-select:none}
.fmt-sw label:hover{color:var(--gray-600)}
.fmt-sw input[type=checkbox]{width:13px;height:13px;accent-color:var(--primary)}

/* ===== COLOR PALETTE ===== */
.tool-color-wrap{position:relative;display:inline-flex;align-items:center}
.tool-color-btn{width:28px;height:28px;border:1px solid var(--gray-200);border-radius:var(--radius) 0 0 var(--radius);cursor:pointer;padding:4px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.tool-color-btn:hover{border-color:var(--gray-300)}
.tool-color-preview{display:block;width:18px;height:18px;border-radius:3px}
.tool-color-arrow{width:16px;height:28px;border:1px solid var(--gray-200);border-left:none;border-radius:0 var(--radius) var(--radius) 0;cursor:pointer;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--gray-400);padding:0}
.tool-color-arrow:hover{background:var(--gray-100)}
.color-palette{position:fixed;background:var(--bg);border:1px solid var(--gray-200);border-radius:var(--radius);padding:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:1000;display:none}
.color-palette.show{display:block}
.color-palette-grid{display:grid;grid-template-columns:repeat(8,22px);gap:3px}
.color-palette-grid span{width:22px;height:22px;border-radius:3px;cursor:pointer;border:1px solid var(--gray-200)}
.color-palette-grid span:hover{transform:scale(1.15);border-color:var(--gray-400)}
.color-palette-custom{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray-500)}
.color-palette-custom input{width:60px;height:22px;border:1px solid var(--gray-200);border-radius:3px;padding:0 4px;font-size:11px}

/* ===== DOCUMENT VIEW ===== */
.doc-page{max-width:780px;margin:0 auto 40px;padding:60px 72px;background:var(--bg);box-shadow:var(--shadow);border:1px solid var(--gray-200);border-radius:var(--radius);min-height:600px}
.doc-node{position:relative}
.doc-h1{font-size:22px;font-weight:700;color:var(--gray-900);margin:28px 0 10px;line-height:1.4}
.doc-h2{font-size:18px;font-weight:600;color:var(--gray-800);margin:20px 0 8px;line-height:1.4}
.doc-h3{font-size:15px;font-weight:600;color:var(--gray-700);margin:14px 0 6px;line-height:1.4}
.doc-h4,.doc-h5,.doc-h6{font-size:14px;font-weight:600;color:var(--gray-600);margin:10px 0 4px;line-height:1.4}
.doc-body{font-size:14px;line-height:1.8;color:var(--gray-700);margin:4px 0 10px;text-indent:2em}
.doc-page .doc-h1:first-child{margin-top:0}
.doc-num{margin-right:6px;font-weight:400;font-size:90%}
.doc-fold{position:absolute;left:-28px;top:0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:11px;border-radius:var(--radius);user-select:none}
.doc-node:hover>.doc-fold{color:var(--gray-400)}
.doc-node:hover>.doc-fold:hover{background:var(--gray-200);color:var(--text)}
.doc-fold.leaf{cursor:default;font-size:6px}
.doc-fold.leaf:hover{background:transparent}
.doc-editable{outline:none;border-radius:3px;min-height:1em}
.doc-editable:focus{background:var(--blue-50)}
.doc-editable:empty::before{content:attr(data-placeholder);color:var(--gray-300);pointer-events:none}

/* ===== MEDIA ===== */
.media-wrap{display:inline-block;position:relative;margin:8px 0;line-height:0;max-width:100%}
.media-wrap:hover .media-resize-handle{opacity:1}
.media-img{max-width:100%;border-radius:4px;cursor:pointer;display:block}
.media-img.media-selected,.media-video.media-selected,.media-wrap.media-selected{outline:2px solid var(--primary);outline-offset:2px}
.media-video{max-width:100%;border-radius:4px;display:block}
.media-audio{width:100%;margin:4px 0}
.media-caption{font-size:12px;color:var(--gray-400);text-align:center;margin-top:4px;line-height:1.4}
.media-resize-handle{position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;background:var(--primary);border-radius:50%;cursor:nwse-resize;opacity:0;transition:opacity .15s;z-index:10;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.media-wrap.resizing .media-resize-handle{opacity:1}
.outline-media{margin:4px 0}
.outline-media .media-wrap{display:inline-block}
.outline-media img{max-width:100%;border-radius:3px}
.outline-media video{max-width:100%;border-radius:3px}
.lightbox-mask{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
.lightbox-img{max-width:90vw;max-height:90vh;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.4);transition:transform .1s ease-out}
.media-editor{position:absolute;z-index:1500;background:var(--bg);border:1px solid var(--gray-200);border-radius:8px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:220px;font-size:13px}
.media-editor-title{font-weight:600;margin-bottom:8px;color:var(--gray-800)}
.media-editor-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.media-editor-row label{width:50px;color:var(--gray-500);font-size:12px;flex-shrink:0}
.media-editor-row input[type="text"],.media-editor-row select{flex:1;padding:3px 6px;border:1px solid var(--gray-200);border-radius:4px;font-size:12px;outline:none}
.media-editor-row input[type="text"]:focus,.media-editor-row select:focus{border-color:var(--primary)}
.media-editor-row input[type="checkbox"]{accent-color:var(--primary)}
.media-editor-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-100)}
.media-editor-actions button{padding:4px 12px;border-radius:4px;font-size:12px;cursor:pointer;border:1px solid var(--gray-200);background:var(--bg)}
.media-editor-ok{background:var(--primary)!important;color:#fff!important;border-color:var(--primary)!important}
.media-editor-del{color:var(--red,#ef4444)!important;border-color:var(--red,#ef4444)!important}

/* ===== MODAL ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg);border-radius:10px;padding:24px;min-width:360px;max-width:500px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:16px;margin-bottom:14px;color:var(--gray-800)}
.modal p{font-size:13px;color:var(--gray-600);margin-bottom:16px;line-height:1.6}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.btn{padding:6px 16px;border-radius:var(--radius);font-size:13px;cursor:pointer;border:1px solid var(--gray-200);background:var(--bg);color:var(--text)}
.btn:hover{background:var(--gray-50)}
.btn-primary{background:var(--primary);color:white;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-h)}

/* ===== TOAST ===== */
#toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--gray-800);color:white;padding:8px 20px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  #sidebar{position:absolute;right:0;top:0;bottom:0;z-index:100;box-shadow:-4px 0 20px rgba(0,0,0,.1)}
  .doc-page{padding:24px 20px;margin:10px}
  #outline-view{padding:10px 8px 60px}
  #toolbar{padding:0 6px}
}
</style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <header id="header">
    <div id="menu-bar">
      <span class="logo">UDD</span>
      <input id="doc-title" class="doc-title" value="未命名文档" spellcheck="false">
      <button class="menu-btn primary" onclick="app.newFile()" title="Ctrl+N">新建</button>
      <button class="menu-btn" onclick="app.openFile()" title="Ctrl+O">打开</button>
      <button class="menu-btn" onclick="app.saveFile()" title="Ctrl+S">保存</button>
      <button class="menu-btn" onclick="app.saveFileAs()">另存为</button>
      <div class="menu-sep"></div>
      <button class="menu-btn" onclick="app.exportJSON()">导出JSON</button>
      <button class="menu-btn" onclick="app.importJSON()">导入JSON</button>
    </div>
    <div id="toolbar">
      <button class="tool-btn" onclick="app.undo()" title="撤销 Ctrl+Z">↩</button>
      <button class="tool-btn" onclick="app.redo()" title="重做 Ctrl+Shift+Z">↪</button>
      <div class="tool-sep"></div>
      <select id="tool-font" class="tool-select" onchange="app.setNodeStyle('font',this.value)" title="字体">
        <option value="微软雅黑">微软雅黑</option>
        <option value="宋体">宋体</option>
        <option value="黑体">黑体</option>
        <option value="楷体">楷体</option>
        <option value="仿宋">仿宋</option>
        <option value="Arial">Arial</option>
        <option value="Times New Roman">Times New Roman</option>
      </select>
      <select id="tool-size" class="tool-select" onchange="app.setNodeStyle('font_size',+this.value)" title="字号" style="width:60px">
        <option value="12">12</option><option value="14">14</option><option value="16">16</option>
        <option value="18">18</option><option value="20">20</option><option value="24">24</option>
        <option value="28">28</option><option value="32">32</option><option value="36">36</option>
      </select>
      <div class="tool-sep"></div>
      <button id="tool-bold" class="tool-btn" onclick="app.toggleStyle('bold')" title="加粗 Ctrl+B"><b>B</b></button>
      <button id="tool-italic" class="tool-btn" onclick="app.toggleStyle('italic')" title="斜体 Ctrl+I"><i>I</i></button>
      <button id="tool-underline" class="tool-btn" onclick="app.toggleStyle('underline')" title="下划线 Ctrl+U"><u>U</u></button>
      <button id="tool-strike" class="tool-btn" onclick="app.toggleStyle('strikethrough')" title="删除线"><s>S</s></button>
      <div class="tool-sep"></div>
      <div class="tool-color-wrap" id="color-wrap-fg">
        <button type="button" class="tool-color-btn" id="tool-color-btn" onclick="app.applyLastColor('fg')" title="字体颜色">
          <span class="tool-color-preview" id="tool-color-preview" style="background:#1e293b"></span>
        </button>
        <button type="button" class="tool-color-arrow" onclick="app.toggleColorPalette('fg')">▾</button>
        <div class="color-palette" id="palette-fg"></div>
      </div>
      <div class="tool-color-wrap" id="color-wrap-bg">
        <button type="button" class="tool-color-btn" id="tool-bg-btn" onclick="app.applyLastColor('bg')" title="背景色">
          <span class="tool-color-preview" id="tool-bg-preview" style="background:#ffffff;border:1px solid var(--gray-200)"></span>
        </button>
        <button type="button" class="tool-color-arrow" onclick="app.toggleColorPalette('bg')">▾</button>
        <div class="color-palette" id="palette-bg"></div>
      </div>
      <div class="tool-sep"></div>
      <button id="tool-align-left" class="tool-btn" onclick="app.setNodeStyle('text_align','left')" title="左对齐">≡</button>
      <button id="tool-align-center" class="tool-btn" onclick="app.setNodeStyle('text_align','center')" title="居中">≡</button>
      <button id="tool-align-right" class="tool-btn" onclick="app.setNodeStyle('text_align','right')" title="右对齐">≡</button>
      <div class="tool-sep"></div>
      <select id="tool-numbering" class="tool-select" onchange="app.setNumbering(this.value)" title="编号样式" style="width:90px">
        <option value="1.1.1">1.1.1</option>
        <option value="一.1.1">一.1.1</option>
        <option value="I.A.1">I.A.1</option>
        <option value="bullet">无序</option>
        <option value="bullet-uniform">统一无序</option>
        <option value="none">无编号</option>
      </select>
      <div class="tool-sep"></div>
      <button class="tool-btn" onclick="app.insertMedia()" title="插入媒体">🖼</button>
    </div>
    <div class="fmt-sw" id="fmt-switches">
      <label><input type="checkbox" data-fmt="font" checked>字体</label>
      <label><input type="checkbox" data-fmt="font_size" checked>字号</label>
      <label><input type="checkbox" data-fmt="color" checked>颜色</label>
      <label><input type="checkbox" data-fmt="bold" checked>加粗</label>
      <label><input type="checkbox" data-fmt="italic">斜体</label>
      <label><input type="checkbox" data-fmt="underline">下划线</label>
      <label><input type="checkbox" data-fmt="strikethrough">删除线</label>
      <label><input type="checkbox" data-fmt="background_color">背景色</label>
      <label><input type="checkbox" data-fmt="text_align">对齐</label>
    </div>
    <div id="view-tabs">
      <button class="view-tab active" data-view="outline" onclick="app.switchView('outline')">大纲</button>
      <button class="view-tab" data-view="document" onclick="app.switchView('document')">文档</button>
      <div class="spacer"></div>
      <button id="sidebar-toggle" onclick="app.toggleSidebar()">侧边栏</button>
    </div>
  </header>

  <!-- MAIN -->
  <main id="main">
    <div id="editor">
      <div id="outline-view" class="active"></div>
      <div id="document-view"></div>
    </div>
    <div id="sidebar">
      <div class="sidebar-header">
        <span>原始数据</span>
        <button onclick="app.applySidebarJSON()" title="应用修改">✓</button>
      </div>
      <div id="sidebar-content">
        <textarea id="sidebar-json" spellcheck="false"></textarea>
      </div>
    </div>
  </main>

  <!-- STATUS BAR -->
  <footer id="status-bar">
    <span id="stat-nodes">节点: 0</span>
    <span class="sep"></span>
    <span id="stat-words">字数: 0</span>
    <span class="sep"></span>
    <span id="stat-level">层级: -</span>
    <span class="sep"></span>
    <span id="stat-save">未保存</span>
  </footer>
</div>

    if (k === afterKey) { temp[newKey] = newValue; found = true; }

}
function insertBefore(obj, beforeKey, newKey, newValue) {

function applyFmtStyle(el, style, fmt) {

function buildNodeStyle(data, path, level, opts = {}) {
  const { isBody = false } = opts;
  const tg = data.type_global || {};
  const style = {};
  const computedLevel = (typeof level === 'number') ? level : (path ? getLevel(path.split('.').pop()) : 0);
  const node = path ? getNodeByPath(data, path) : null;

  if (isBody) {
    for (const [k,v] of Object.entries(tg)) {
      if (k.startsWith('body.')) style[k.substring(5)] = resolveStyleBaseValue(v);
    }
    const prefix = `t${computedLevel}-*.body.`;
    for (const [k,v] of Object.entries(tg)) {
      if (k.startsWith(prefix)) style[k.substring(prefix.length)] = resolveStyleBaseValue(v);
    }
  } else {
    const wildcard = 't*-*.';
    for (const [k,v] of Object.entries(tg)) {
      if (k.startsWith(wildcard)) {
        const field = k.substring(wildcard.length);
        if (field.startsWith('body.')) continue;
        style[field] = resolveStyleBaseValue(v);
      }
    }
    const prefix = `t${computedLevel}-*.`;
    for (const [k,v] of Object.entries(tg)) {
      if (k.startsWith(prefix)) {
        const field = k.substring(prefix.length);
        if (field.startsWith('body.')) continue;

function getSelectionOffsetsWithin(el) {
  if (!el) return null;
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  if (!el.contains(range.startContainer) || !el.contains(range.endContainer)) return null;
  const start = getOffsetWithin(el, range.startContainer, range.startOffset);
  const end = getOffsetWithin(el, range.endContainer, range.endOffset);
  return { start: Math.min(start, end), end: Math.max(start, end) };
}

function getOffsetWithin(root, node, offset) {
  const pre = document.createRange();
  pre.selectNodeContents(root);
  pre.setEnd(node, offset);

}

function createBodyBtn(node, path, view) {
  const hasBody = node.body !== undefined && node.body !== '';
  const btn = document.createElement('span');
  btn.className = 'body-btn';
  if (hasBody) {
    btn.textContent = node.hide_body ? '▸' : '▾';
    btn.title = node.hide_body ? '展开正文' : '折叠正文';
    btn.onclick = (e) => {
      e.stopPropagation();
      node.hide_body = node.hide_body ? 0 : 1;
      view.focusPath = path;
      view.render(view.data);
      app.markDirty();
    };
  } else {
    btn.textContent = '+';
    btn.title = '添加正文';
    btn.onclick = (e) => {
      e.stopPropagation();
      node.body = '';
      node.hide_body = 0;
      view.focusPath = path;
      view.focusField = 'body';
      view.render(view.data);
      app.markDirty();
    };
  }
  return btn;
}

function createFoldToggle(node, path, level, view, className) {
  const childKeys = getChildTKeys(node, level + 1);
  const el = document.createElement('span');
  el.className = className + (childKeys.length === 0 ? ' leaf' : '');
  el.textContent = childKeys.length === 0 ? '•' : (node.hide ? '▶' : '▼');
  el.onclick = () => {
    if (childKeys.length === 0) return;
    node.hide = node.hide ? 0 : 1;
    view.focusPath = path;
    view.render(view.data);
    app.markDirty();
  };
  return el;
}

function indentNodeData(data, path) {
  const parts = path.split('.');
  const currentKey = parts[parts.length - 1];
  const level = getLevel(currentKey);
  let parent = parts.length === 1 ? data : getNodeByPath(data, parts.slice(0,-1).join('.'));
  let prevKey;
  if (parts.length === 1) {
    const allRootKeys = getAllTKeys(parent);
    const idx = allRootKeys.indexOf(currentKey);
    if (idx <= 0) return null;
    prevKey = allRootKeys[idx - 1];
  } else {
    const siblings = getChildTKeys(parent, level);
    const idx = siblings.indexOf(currentKey);
    if (idx <= 0) return null;
    prevKey = siblings[idx - 1];
  }
  const prevNode = parent[prevKey];
  const node = parent[currentKey];
  delete parent[currentKey];
  const prevLevel = getLevel(prevKey);
  const newLevel = prevLevel + 1;
  const levelDiff = newLevel - level;
  const newSeqNum = nextSeq(prevNode, newLevel);
  const newKey = `t${newLevel}-${newSeqNum}`;
  prevNode[newKey] = levelDiff !== 0 ? relevelNode(node, levelDiff) : Object.assign({}, node);
  prevNode[newKey].content = node.content;
  prevNode[newKey].body = node.body;
  prevNode[newKey].hide = node.hide || 0;
  prevNode[newKey].hide_body = node.hide_body || 0;
  for (const k of Object.keys(node)) {
    if (!isTNode(k) && prevNode[newKey][k] === undefined) prevNode[newKey][k] = node[k];
  }
  prevNode.hide = 0;
  const prevPath = parts.length === 1 ? prevKey : parts.slice(0,-1).join('.') + '.' + prevKey;
  return prevPath + '.' + newKey;
}

function outdentNodeData(data, path) {
  const parts = path.split('.');
  const currentKey = parts[parts.length - 1];
  const level = getLevel(currentKey);
  if (parts.length === 1) {
    if (level === 0) return null;
    const node = data[currentKey];
    const newSeqNum = nextSeq(data, level - 1);
    const newKey = `t${level - 1}-${newSeqNum}`;
    const newNode = relevelNode(node, -1);
    newNode.content = node.content;
    newNode.body = node.body;
    newNode.hide = node.hide || 0;
    newNode.hide_body = node.hide_body || 0;
    for (const k of Object.keys(node)) {
      if (!isTNode(k) && newNode[k] === undefined) newNode[k] = node[k];
    }
    const entries = Object.entries(data);
    const temp = {};
    for (const [k, v] of entries) {
      if (k === currentKey) temp[newKey] = newNode;

  let parentNode = grandParent[parentKey];

  const newLevel = level - 1;
  const newSeqNum = nextSeq(grandParent, newLevel);
  const newKey = `t${newLevel}-${newSeqNum}`;
  const newNode = relevelNode(node, -1);
  newNode.content = node.content;

  newNode.hide = node.hide || 0;
  newNode.hide_body = node.hide_body || 0;
  for (const k of Object.keys(node)) {

  }
  insertAfter(grandParent, parentKey, newKey, newNode);

}

}

function resolveMediaSrc(src) {
  if (typeof app !== 'undefined' && app.resolveMediaSrc) return app.resolveMediaSrc(src);
  return src;
}
function renderTextWithMedia(text, container, mediaInfo, opts) {
  if (!text) return;
  const noAlign = opts && opts.suppressAlign;
  const parts = text.split(MEDIA_RE);
  for (let i = 1; i < parts.length; i += 2) {
    const media = parseMediaTag(parts[i]);
    if (!media) continue;
    if (media.image) {
      const alignBox = document.createElement('div');
      if (!noAlign && media['image.align']) alignBox.style.textAlign = media['image.align'];
      const wrapper = document.createElement('div');
      wrapper.className = 'media-wrap';
      const imgW = media['image.width'] || '';
      if (imgW) wrapper.style.width = imgW;
      const img = document.createElement('img');
      img.src = resolveMediaSrc(media.image);
      img.className = 'media-img';
      img.style.width = '100%';
      const imgH = media['image.height'] || '';
      if (imgH && !imgW.endsWith('%')) img.style.height = imgH;
      if (media['image.angle']) img.style.transform = `rotate(${media['image.angle']}deg)`;
      if (media['image.border']) img.style.border = '1px solid var(--gray-300)';
      img.draggable = false;
      img.ondblclick = (e) => { e.stopPropagation(); showLightbox(img.src); };
      img.onclick = (e) => { e.stopPropagation(); showMediaEditor(wrapper, mediaInfo); };
      wrapper.appendChild(img);
      const handle = document.createElement('div');
      handle.className = 'media-resize-handle';
      handle.onmousedown = (e) => startMediaResize(e, img, wrapper, mediaInfo);
      wrapper.appendChild(handle);
      if (media['image.caption']) {
        const cap = document.createElement('div');
        cap.className = 'media-caption';
        cap.textContent = media['image.caption'];
        wrapper.appendChild(cap);
      }
      alignBox.appendChild(wrapper);
      container.appendChild(alignBox);
    } else if (media.video) {
      const alignBox = document.createElement('div');
      if (!noAlign && media['video.align']) alignBox.style.textAlign = media['video.align'];
      const wrapper = document.createElement('div');
      wrapper.className = 'media-wrap';
      const vidW = media['video.width'] || '';
      const vidH = media['video.height'] || '';
      if (vidW) wrapper.style.width = vidW;
      const vid = document.createElement('video');
      vid.src = resolveMediaSrc(media.video);
      vid.className = 'media-video';
      vid.controls = true;
      vid.style.width = '100%';
      if (vidH && !vidW.endsWith('%')) vid.style.height = vidH;
      if (media['video.autoplay']) vid.autoplay = true;
      if (media['video.loop']) vid.loop = true;
      if (media['video.poster']) vid.poster = resolveMediaSrc(media['video.poster']);
      vid.onclick = (e) => { e.stopPropagation(); showMediaEditor(wrapper, mediaInfo); };
      wrapper.appendChild(vid);
      const handle = document.createElement('div');
      handle.className = 'media-resize-handle';
      handle.onmousedown = (e) => startMediaResize(e, vid, wrapper, mediaInfo);
      wrapper.appendChild(handle);
      alignBox.appendChild(wrapper);
      container.appendChild(alignBox);
    } else if (media.audio) {
      const aud = document.createElement('audio');
      aud.src = resolveMediaSrc(media.audio);
      aud.controls = true;
      aud.className = 'media-audio';
      aud.onclick = (e) => { e.stopPropagation(); showMediaEditor(aud, mediaInfo); };
      container.appendChild(aud);
    }
  }
}
// Drag-to-resize
function startMediaResize(e, el, wrapper, mediaInfo) {
  e.preventDefault();
  e.stopPropagation();
  const startX = e.clientX;
  const startW = wrapper.offsetWidth;
  const alignBox = wrapper.parentElement;
  const parentW = alignBox && alignBox.parentElement ? alignBox.parentElement.offsetWidth : startW;
  wrapper.classList.add('resizing');
  const onMove = (ev) => {
    const dx = ev.clientX - startX;
    const newW = Math.max(50, startW + dx);
    wrapper.style.width = newW + 'px';
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    wrapper.classList.remove('resizing');
    if (mediaInfo && mediaInfo.path && mediaInfo.field) {
      const node = getNodeByPath(app.data, mediaInfo.path);
      if (node) {
        const text = node[mediaInfo.field] || '';
        const finalW = wrapper.offsetWidth;
        const pct = Math.round(finalW / parentW * 100);
        const widthStr = pct + '%';
        const mediaType = el.tagName === 'VIDEO' ? 'video' : 'image';
        const updated = text.replace(MEDIA_RE, (match, content) => {
          try {
            const obj = JSON.parse('{' + content + '}');
            if (obj[mediaType]) {
              obj[mediaType + '.width'] = widthStr;
              delete obj[mediaType + '.height'];
              const inner = JSON.stringify(obj).slice(1, -1);
              return '{{' + inner + '}}';
            }
          } catch(ex) {}
          return match;
        });
        node[mediaInfo.field] = updated;
        app.markDirty();
      }
    }
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// Lightbox preview
function showLightbox(src) {
  const mask = document.createElement('div');
  mask.className = 'lightbox-mask';
  const img = document.createElement('img');
  img.src = src;
  img.className = 'lightbox-img';
  mask.appendChild(img);
  mask.onclick = () => mask.remove();
  mask.onwheel = (e) => {
    e.preventDefault();
    const scale = e.deltaY < 0 ? 1.1 : 0.9;
    const cur = parseFloat(img.style.transform.replace(/scale\(([^)]+)\)/, '$1')) || 1;
    img.style.transform = `scale(${cur * scale})`;
  };
  document.body.appendChild(mask);
}

// Media property editor popup
function showMediaEditor(mediaEl, mediaInfo) {
  closeMediaEditor();
  const text = (() => {
    const node = getNodeByPath(app.data, mediaInfo.path);
    return node ? (node[mediaInfo.field] || '') : '';
  })();
  const match = text.match(/\{\{(.*?)\}\}/);
  if (!match) return;
  const media = parseMediaTag(match[1]);
  if (!media) return;
  const mediaType = media.image ? 'image' : media.video ? 'video' : 'audio';

  mediaEl.classList.add('media-selected');

  const popup = document.createElement('div');
  popup.className = 'media-editor';
  popup.id = 'media-editor-popup';

  const fields = [];
  if (mediaType === 'image') {
    fields.push(
      {key: 'image.width', label: '宽度', val: media['image.width'] || ''},
      {key: 'image.height', label: '高度', val: media['image.height'] || ''},
      {key: 'image.align', label: '对齐', val: media['image.align'] || '', type: 'select', opts: ['','left','center','right']},
      {key: 'image.angle', label: '旋转', val: media['image.angle'] || ''},
      {key: 'image.caption', label: '说明', val: media['image.caption'] || ''},
      {key: 'image.border', label: '边框', val: media['image.border'] || '', type: 'check'},
    );
  } else if (mediaType === 'video') {
    fields.push(
      {key: 'video.width', label: '宽度', val: media['video.width'] || ''},
      {key: 'video.height', label: '高度', val: media['video.height'] || ''},
      {key: 'video.align', label: '对齐', val: media['video.align'] || '', type: 'select', opts: ['','left','center','right']},
      {key: 'video.autoplay', label: '自动播放', val: media['video.autoplay'] || '', type: 'check'},
      {key: 'video.loop', label: '循环', val: media['video.loop'] || '', type: 'check'},
    );
  }

  let html = `<div class="media-editor-title">${mediaType === 'image' ? '图片' : '视频'}属性</div>`;
  for (const f of fields) {
    if (f.type === 'select') {
      const optHtml = f.opts.map(o => `<option value="${o}"${o===f.val?' selected':''}>${o||'默认'}</option>`).join('');
      html += `<div class="media-editor-row"><label>${f.label}</label><select data-key="${f.key}">${optHtml}</select></div>`;
    } else if (f.type === 'check') {
      html += `<div class="media-editor-row"><label>${f.label}</label><input type="checkbox" data-key="${f.key}" ${f.val?'checked':''}></div>`;
    } else {
      html += `<div class="media-editor-row"><label>${f.label}</label><input type="text" data-key="${f.key}" value="${f.val}" placeholder="${f.label}"></div>`;
    }
  }
  html += `<div class="media-editor-actions"><button class="media-editor-del">删除</button><button class="media-editor-ok">确定</button></div>`;
  popup.innerHTML = html;

  const rect = mediaEl.getBoundingClientRect();
  popup.style.top = (rect.bottom + window.scrollY + 4) + 'px';
  popup.style.left = (rect.left + window.scrollX) + 'px';
  document.body.appendChild(popup);

  popup.onclick = (e) => e.stopPropagation();

  popup.querySelector('.media-editor-ok').onclick = () => {
    app.pushUndo();
    const node = getNodeByPath(app.data, mediaInfo.path);
    if (!node) return;
    const curText = node[mediaInfo.field] || '';
    const updated = curText.replace(/\{\{(.*?)\}\}/, (m, content) => {
      try {
        const obj = JSON.parse('{' + content + '}');
        popup.querySelectorAll('[data-key]').forEach(el => {
          const k = el.dataset.key;
          if (el.type === 'checkbox') {
            if (el.checked) obj[k] = 1; else delete obj[k];
          } else {
            if (el.value) obj[k] = el.value; else delete obj[k];
          }
        });
        return '{{' + JSON.stringify(obj).slice(1,-1) + '}}';
      } catch(ex) { return m; }
    });
    node[mediaInfo.field] = updated;
    closeMediaEditor();
    app.renderCurrentView();
    app.markDirty();
  };

  popup.querySelector('.media-editor-del').onclick = () => {
    app.pushUndo();
    const node = getNodeByPath(app.data, mediaInfo.path);
    if (!node) return;
    node[mediaInfo.field] = (node[mediaInfo.field] || '').replace(/\{\{.*?\}\}/, '');
    closeMediaEditor();
    app.renderCurrentView();
    app.markDirty();
    toast('已删除媒体');
  };

  setTimeout(() => {
    document.addEventListener('click', closeMediaEditorOnOutside);
  }, 0);
}

function closeMediaEditorOnOutside(e) {
  const popup = document.getElementById('media-editor-popup');
  if (popup && !popup.contains(e.target)) closeMediaEditor();
}

function closeMediaEditor() {
  const popup = document.getElementById('media-editor-popup');
  if (popup) popup.remove();
  document.querySelectorAll('.media-selected').forEach(el => el.classList.remove('media-selected'));
  document.removeEventListener('click', closeMediaEditorOnOutside);
}

// ================================================================
//  INDEXEDDB STORAGE
// ================================================================
const DB_NAME = 'udd-db', DB_VER = 2, STORE = 'docs', MEDIA_STORE = 'media';
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE, { keyPath: 'name' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbSave(id, data) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put({ id, data: deepClone(data), ts: Date.now() });
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}
async function dbLoad(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(id);
    req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error);
  });
}
async function dbSaveMedia(name, blob) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readwrite');
    tx.objectStore(MEDIA_STORE).put({ name, blob });
    tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
  });
}
async function dbLoadAllMedia() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(MEDIA_STORE, 'readonly');
    const req = tx.objectStore(MEDIA_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []); req.onerror = () => reject(req.error);
  });
}

// ================================================================
//  UNDO MANAGER
// ================================================================
class UndoManager {
  constructor(limit = 80) { this.stack = []; this.pos = -1; this.limit = limit; }
  push(data) {
    this.stack = this.stack.slice(0, this.pos + 1);
    this.stack.push(deepClone(data));
    if (this.stack.length > this.limit) this.stack.shift();
    this.pos = this.stack.length - 1;
  }
  undo() { return this.pos > 0 ? deepClone(this.stack[--this.pos]) : null; }
  redo() { return this.pos < this.stack.length - 1 ? deepClone(this.stack[++this.pos]) : null; }
}
